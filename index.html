        plainText: "Mark Carney shows middle powers how to handle a dangerous world — 2026/10/17 Mark Carney shows middle powers how to handle a dangerous world Entitled Canada has been feeding off America for decades. Like a parasitic bug, it enjoys the benefits of being America's cherished 51st state without giving anything back. Canadians know they couldn't live without America's protection, yet their ungrateful prime minister, Mark Carney, refuses to defer to the great and beautiful country over the border. That is how Donald Trump sees Canada, and it leaves no room for mutual benefit between the two allies. The bullying president is ratcheting up tariffs. Canadian consumers, in response, are spitting out their Kentucky bourbon and leaving Las Vegas. Mr Carney, in office for 18 months, remains defiant, the star of an extended, dramatic and riveting stand-off. By now you might have expected Mr Carney to have caved in. Canada is only a mid size power with a so-so economy and puny armed forces. It has vulnerabilities aplenty. One will be evident on October 19th, when the province of Alberta holds a referendum asking if it may one day secede, taking with it more oil in the ground than in the entire United States. In fact Mr Carney is riding high. Polls suggest that those Albertans will probably vote to stay. And under him, Canada is doing better than you might expect. In January it was Mr Carney, at the annual jamboree in Davos, who argued that what he called the \"middle powers\" must find ways to take on threatening ones. Nine months on, his country offers lessons for what these middle powers should do when the hegemonic giant pulls the mat from under them. Those lessons start with a bracing dose of realism. As we set out, middle powers will never replace the hegemons as the force that sustains powerful permanent institutions such as the UN. The world has grown more dangerous because both America and China are exploiting or undermining arrangements and norms in which power was shared. Emboldened, wreckers like Russia and Iran are becoming even more predatory. Co-ordinating the more herbivorous middle powers is often too hard to get much done—as you can see in even the most developed middle-power club, the European Union. Yet middle powers can still mitigate some of the damage, as Canada and its allies show. Mr Carney has zipped around the world making new trade deals as well as drumming up symbolic agreements, such as talk of associate EU membership. In the realm of defence, Canada is trimming its old reliance on America, and is considering placing an order for Swedish Gripen fighter jets. Canada's most important lesson, however, emerges from what the pragmatic Mr Carney is doing at home. A few years ago the country's woeful politics and ailing government seemed broken. Income per person had drifted from 90% of America's in the 1980s to just 71% in 2022, much of it following a recent burst of low-skilled immigration. Today Mr Carney is pushing through overdue measures to boost productivity, open the economy and lift defence spending from a pitifully low 1.3% of GDP to 2%. Among his first steps, he scrapped an unpopular consumer carbon tax and vowed to build a pipeline to carry oil from Alberta to the west coast. He has started to cut internal barriers to trade, called off a hefty rise in capital-gains tax, cut the lowest rate of income tax and set out plans to trim federal spending. Mr Carney has so far managed to resist what is known as the \"Juncker curse\", named after a president of the European Commission, Jean-Claude Juncker. Speaking of reform, Mr Juncker once said: \"We all know what to do, we just don't know how to get re-elected after we've done it.\" Yet Mr Carney's popularity has been surging even as he reforms. Today a maple-leaf love-in is under way: polls show the prime minister's approval rating nearing 70%. Internationally, he has replaced France's beleaguered Emmanuel Macron as the centrists' pin-up. The contrast with Mr Trump, unloved by his own voters, is stark. True, Canada must go further and faster with its liberalising changes. There is every chance that relations with America will improve when Mr Trump leaves office in 2029, but it is not certain. It should therefore work on keeping its options open. Other middle powers can learn from Canada. And they can fortify themselves abroad by harnessing the need for change at home. In a way, Mr Trump has done all democracies a favour, by giving them a reason to tackle long-standing problems that seemed too hard. The middle powers need to prepare for a dangerous world. They should look to Mr Carney and Canada for an answer on what to do.",

        title: "Video Cameras Are Everywhere-and Now They Are Being Hacked for War",
        publishDate: "2026-10-16",

        readingPath: "/outward-reading/articles/2026/10/2026-10-16_001.reading.html",
        source: "The Economist",
        cleanPath: "/outward-reading/articles/2026/10/2026-10-16_001.clean.html",
        annotatedPath: "/outward-reading/articles/2026/10/2026-10-16_001.annotated.html",
        plainText: "Video Cameras Are Everywhere-and Now They Are Being Hacked for War — 2026/10/16 Video Cameras Are Everywhere-and Now They Are Being Hacked for War As U.S. and Israeli forces bombed Iran early this year, a poultry farmer in northern Israel decided to check on his chickens. When he launched the app on his phone for the webcam outside his coop, he was alarmed to see that its language had been switched to Arabic. He contacted Israel's National Cyber Directorate, which found that hackers had taken control of the Chinese-made camera. They weren't interested in chickens. The camera's orientation on the coop offered it a line of sight to the movements of Israeli security forces along the nearby border with Lebanon. The cyber directorate said it helped the farmer harden the camera's security and adjust its viewing angle to stop capturing military operations. The farmer's webcam was one of an estimated 1.2 billion internet-connected cameras worldwide, according to cybersecurity consultants S-RM. The devices have become a background fixture of daily life in the form of security systems, doorbells, traffic controls and even baby monitors—and potentially any of them are vulnerable to snooping, say cybersecurity experts and hackers. \"We are now seeing the conversion of civilian surveillance into wartime intelligence collection,\" said Alexander Leslie, a national-security expert at threat-intelligence consultants Recorded Future, who sees a global \"soft underbelly\" in omnipresent digital eyeballs. Intelligence agencies scour the internet for vulnerable cameras and robotically tap in to them by testing millions of passwords. Now, AI has made it even easier to hack into them and analyze their data at scale, transforming cameras that were designed to boost safety into tools for combatants to track, surveil and attack the enemy—often surpassing the abilities of human intelligence analysts. Algorithms digest endless reams of footage to find hidden gems and patterns for agents to monitor. Russia and Ukraine have ramped up camera-hacking in their war, aiming to spy on each other, find new targets and assess damage from their attacks. Israel, long a master of digital spycraft, hacked into Iranian traffic cameras to help forces collect intelligence used in the assassination of Iranian Supreme Leader Ali Khamenei earlier this year. Iran and its proxies have struck back by breaking into hundreds of Israeli webcams and security cameras that Israeli officials consider sensitive to national security, like the one on the chicken coop. In 2024, Russian hackers commandeered residential webcams in Kyiv, including one installed by a condominium association to monitor the neighborhood. Ukraine's security service, the SBU, said that Russia intended to use the hacked video feeds to find targets in the capital and \"to adjust missile attacks on Ukraine,\" refining their aim for subsequent strikes. The SBU said it has identified and secured, reoriented or blocked roughly 40,000 video cameras that posed potential security risks since Russia's 2022 invasion. Hacked cameras are taking over roles in targeting, damage assessments and other combat intelligence-gathering that were previously supplied by aerial reconnaissance or on-the-ground spies. Penetrating a well-placed camera can get analysts closer to targets and carries less risk than infiltrating even the canniest secret agent. Video cameras operate silently, often in restricted areas. While private individuals and enterprise-network managers are increasingly attuned to cybersecurity, web-connected devices like cameras may have fewer built-in protections and not be consistently monitored, patched or updated, said Xu Zou, senior vice president for cloud security services at cybersecurity company Palo Alto Networks. Information-security specialists inside companies and governments often aren't aware of connected cameras, which are frequently installed and operated by facilities managers or other non-IT teams, he said. Ondrej Svoboda in Prague was reading to his young children one evening in 2023 when the baby monitor in their room started emitting strange sounds of people talking and background music, as if from a bar. At first he thought his wife was using the two-way function but quickly realized that hackers had gotten into his system. \"I didn't think this was something that could happen to me,\" recalled Svoboda, who worked at a cybersecurity company. \"I was really scared-my heart was racing.\" Trying to avoid frightening his children, he silently stared into the camera to show the hackers he knew about them and then unplugged the camera. For days he suffered nightmares as he struggled to understand how he got hacked. Eventually he remembered he had tried connecting his webcams to another app, which likely was insecure. Vulnerable accessories linked into a network are among hackers' prime targets, expanding what technicians call the attack surface. Often, cameras aren't the target, but serve as the weak link in a larger hacking attempt. Ransomware group Akira tapped an unprotected webcam to get around one organization's network-security systems and extort it, S-RM reported last year. Once hackers are inside a local network, they can usually probe stored files, email accounts and other devices, including cameras. \"The Internet of Things is such a wild area that everything-whether you realize it or not—is an extension of your attack surface,\" said Paul Caron, S-RM head of cyber for the Americas.",

        plainText: "China is turning trash into treasure on a vast scale — 2026/10/15 China is turning trash into treasure on a vast scale A fast-growing number of EVs will soon be scrapped and replaced. Shredding their batteries yields \"black mass\", a powder from which valuable metals such as lithium, cobalt and nickel can be recovered and reused. From next month the EU will make it harder to export this waste. The aim is to encourage more processing of black mass close to home (at the moment most is shipped to Asia). In August America, which has banned Chinese EVs but still imports lots of Chinese batteries, blocked all black-mass exports. China, however, is unlikely to suffer. Black mass might make up 20-30% of global demand for battery metals by 2050, says the International Energy Agency, a forecaster. So China is supercharging its recycling industries: not just to shore up supplies of battery metals, but also rare earths and much else. The goal is to make its economy less \"linear\" (where raw materials are made into products which are then thrown away) and more \"circular\" (closing the loop so recycled waste replaces raw materials). Once recycling efforts were driven by concerns about pollution. Now, amid a global scramble for the materials needed to build a high-tech economy, security has become a primary motive. In the 1980s China started to import waste, taking the hardware, paper and plastic that richer countries did not want. A sprawling informal recycling-sector emerged, led by scavengers picking through rubbish piles. Much ended up in landfills or burnt in the open air, leaching toxic chemicals and creating poisonous smog. China is still well behind squeaky-clean European countries when it comes to waste management (though it is hard to say how far, as it does not publish detailed national data for recycling). Its poorer rural areas are still often strewn with rubbish. But officials have made China's big cities, at least, cleaner and more pleasant to live in. Now their focus is shifting to the use of recycling for the sake of security. In July China released a plan for the development of the circular economy until 2030. \"The importance of resource security has become increasingly prominent, while geopolitical dynamics...have grown complex and severe,\" the plan noted. First, China wants to dominate high-tech manufacturing in everything from robotics to wind turbines. And second, to achieve this, it must secure supplies of raw materials, connect more power lines and build more data-centres. Massive amounts of aluminium, copper, battery metals and rare earths are needed. While China controls the bulk of the global refining capacity for these materials, it relies on imports for most of the ores. Meanwhile many Western countries want to reduce reliance on China's factories. Officials worry they might try to squeeze its supplies. Last year a researcher at a state-owned research facility said that without recycling China would \"keep facing strangleholds in the future\". That China already makes vast quantities of these goods should make recycling simpler to do. Factories can tweak designs so that products are easier to dismantle later. And many battery-producing techniques (such as using acids and heat to isolate valuable metals) are also used in recycling them. Take CATL, for example, the world's largest battery-maker. Most of the Chinese firm's sales are domestic, and will end up being processed by a CATL subsidiary called Brunp, which is the world's biggest battery-recycler. Such arrangements have helped China build 85% of global battery recycling capacity. China is trying to make the recycling of rare earths (which it claims now supplies 10% of them) more efficient. At present it is far more costly than extracting them from raw materials. Still, Chinese rare-earth companies, which are almost all state-owned, \"do not rely on economic viability in all cases\", notes Corby Anderson. And to make sure its recycling plants are fed, China is also quietly reassuming its old role in the waste trade. It is selectively rolling back import restrictions on some foreign waste. In 2024 it eased curbs on imports of some scrap copper and aluminum. Last year it started allowing imports of black mass. In January it slashed import tariffs on the stuff from 6.5% to 3%. Officials have pledged to continue to increase imports of \"high-quality\" recycled materials over the next five years. Still, now that America and Europe want to keep their valuable waste, could they eat into China's recycling dominance? Zhang Yuping, the deputy general manager of GEM, a big Shenzhen-listed battery-recycler, thinks not. \"From the perspective of national security, they might have some justification,\" he says. But the cost of recycling outside China would be high and scaling up difficult. Europe, at least, can't digest such a challenge, reckons Mr Zhang. \"They would pay a heavy cost. \" ■",

        plainText: "Are 60-Second Microdramas the Future of Hollywood, or the End? — 2026/10/14 Are 60-Second Microdramas the Future of Hollywood, or the End? 2026/10/14 Are 60-Second Microdramas the Future of Hollywood, or the End? 中国短剧杀进好莱坞：一集60秒、一年赚15亿美元，美国都急了！ In 2020, the entertainment mogul Jeffrey Katzenberg brought to life an idea that must have seemed — in the flash of its conception — foolproof: Netflix, but for people addicted to their phones. He called it Quibi: short for \"quick bites.\" It collapsed after eight months in a total void of public interest. And yet, the joke may very well be on us. Because, just six years later, short-form, mobile-first narrative entertainment is the fastest-growing form of streaming worldwide, per Bloomberg. Microdramas, sometimes called \"verticals,\" are TV shows for your phone. They are typically described as soap operas for Gen Z: hypersexual, over the top and — most important — short, with episodes rarely exceeding two minutes in length. The format was born around 2018 in China, where its revenue now exceeds that of the conventional film industry. As I write this, the form is on track to take in $1.5 billion in revenue in the United States by the end of the year. Each short episode opens with a hook and ends with a twist, dragging viewers, like recalcitrant pets, through entire seasons roughly the length of a feature film. In the first years of this decade, a number of Chinese companies began to export the form abroad, creating countless U.S. microdrama apps and coordinating U.S.-based microdrama shoots in order to supply those apps with content. These companies still retain a near monopoly on U.S. production, but that is quickly changing. Hollywood executives — noticing these apps outranking their own streamers on the charts — have started to spin up microdrama platforms of their own. I'd managed to wrangle three days of set visits on a show called \"Bound by Love,\" a production of ReelShort. Culturally, ReelShort is an interesting case: the flagship brand of an American company originally financed — and still partly owned — by a Chinese digital content group. The 9:16 format that fills a vertical phone screen leaves little room to maneuver, requiring actors to stand unnaturally close together. \"Bound by Love,\" which in its finished form would run more than two and a half hours, was to be shot at a variety of locations over the course of just 11 days. The key grip had an explanation for this: The scenes they were shooting that day were for an early episode, one that would appear before the viewer hit the paywall. As at least a dozen people would subsequently inform me, the platforms are not overly invested in the quality of the episodes that come after — i.e., the episodes a viewer has actually paid to see. The goal is to keep them up, which is distinct from telling a good or even coherent story. What is clear with hindsight is that Quibi failed primarily because it was TV — regular old TV — that happened to be on your phone. The intervening years have taught us that what tends to succeed on phones is phone stuff. This is the terrain that ReelShort and its peers have precision-engineered their content to compete on. Fox Entertainment has made an equity investment in the microdrama platform Holywater. Disney+ has begun to produce microdramas of its own, and Paramount+ has a slate scheduled for the fall. Today microdramas are — as more than one person put it to me — the only game in town. \"I was fighting it for a long time, but Old Hollywood is dead.\" Microdramas, she went on, are commercialized, rule-bound, utterly devoid of artistry. \"And this can't be the end of it for me, so I'm joining the bandwagon.\" The male leads I spoke to, specifically, seemed uniformly thrilled by this professional windfall. It's different for the women. Apparently, China's short-form video platforms had recently seen a milestone: more than $12 million spent in one day on advertisements for A.I.-generated microdramas. The country's microdrama production hubs, meanwhile — sites of industrial-scale production only months earlier — were emptying out. Actors who were in demand last year, stars of the form, were doing food delivery just to survive. Gelb was seeing the writing on the wall: \"Experience shows that, in the microdrama world, what happens in China does not stay in China.\" It's a preview for what's to come for the rest of the world. \" Soon after I returned, it emerged that an average of 470 A.I.-generated microdramas were released on Chinese platforms each day this past January. In the same period, COL Group — a part-owner of ReelShort's parent company — said that it planned to replace 75 percent of its actors with A.I. for titles released in China. I spoke to an executive at COL, a man named Timothy Oh. He seemed amused, if puzzled, by the continued American resistance to A.I.-generated content. \"The reality is, content is content,\" he told me. \"People are already watching A.I. slop on Instagram.\" As I write this, A.I. microdramas are all over the ReelShort homepage, and make up a large percentage of their most-watched charts.",

        plainText: "After the deadliest attack in Saudi Arabia in more than a decade, Crown Prince Mohammed bin Salman faces growing pressure to find a way to stop the Iran-backed Houthi militia in Yemen from firing missiles and drones at his country. Yet the prince, Saudi Arabia's de facto ruler, has few options as he confronts an asymmetrical conflict with an adversary that has become stronger since he led a disastrous war against it a decade ago, analysts say. The Houthis have carried out three fatal attacks on an international airport in the Saudi capital, Riyadh, over the past week. Those included a strike on a passenger terminal on Saturday that killed at least 12 people and injured more than 300, many of them critically, according to the Saudi authorities. They have also hit at the heart of Prince Mohammed's ambitions to transform Saudi Arabia from an insular, oil-dependent nation into a global hub for business and tourism. But there is no easy way for the crown prince to halt the Houthis' attacks. A political resolution with the militia has become increasingly difficult to reach as its confidence and demands grow, and attempting to defeat the Houthis militarily is unlikely to work either, analysts say.",

        plainText: "An International Career Forged by the Struggles of Apartheid — 2026/10/12 An International Career Forged by the Struggles of Apartheid 2026/10/12 An International Career Forged by the Struggles of Apartheid Navi Pillay, who won this year's Nobel Peace Prize, fought racism in South Africa, shaping her international career as a judge and advocate for justice and human rights. She lived her childhood in a slum without sewage or water, attended a school for only children of Indian descent, and knew that her skin color prohibited her from going to the beach her father would drive past during the Christmas season. But she also described a pivotal moment that helped her rise from under the thumb of racism: Parents in her community in the coastal city of Durban pooled their money to send her to university, after her high school principal said she had potential. That opportunity began a barrier-breaking career that led Ms. Pillay to becoming a lawyer, a judge on multiple international courts, the human rights chief of the United Nations and, on Friday, a Nobel Peace Prize laureate. In announcing the prize, the Nobel committee said that Ms. Pillay had been \"instrumental in ensuring that war crimes, crimes against humanity and genocide are prosecuted.\" She becomes the fifth South African to win the award, joining the ranks of the country's most vaunted figures including Nelson Mandela and Archbishop Desmond Tutu. While much of Ms. Pillay's global recognition comes from human rights work she has done abroad, her experiences in South Africa have indelibly shaped her life, and she has remained deeply invested in her home country's sometimes-fragile democracy. \"I see this award as the voice of the majority of the world,\" Ms. Pillay said in an interview with the South African state broadcaster on Friday. She added that a majority of South Africans \"want the rule of law, they want the independent judiciary to be respected.\" She studied law at what is now the University of KwaZulu-Natal. Because it was segregated, Black students had to attend classes at night, said Jessica Neuwirth, a human-rights lawyer and activist who has known Ms. Pillay for four decades. During the day, Ms. Pillay would go to the library, where she found books about the Nuremberg trials, helping inspire her fascination with international justice, Ms. Neuwirth said. When the apartheid government locked up her husband, Gaby Pillay, who was also a lawyer, for political activities and cut off his access to the outside world, Ms. Pillay used his power of attorney to file an action on his behalf, Ms. Neuwirth said. She ended up winning an order prohibiting his torture. Ms. Pillay's struggle to maneuver within a racist system applying unjust laws in some ways helped her develop the persistence she needed, she has said in interviews. She said in a podcast interview last year that she would keep filing legal motions even if they had little chance of succeeding because she believed that was the only weapon she had to fight the system. \"It was clear to me the only thing I can do is keep going, seeking justice,\" she said. She rose to international prominence shortly after apartheid ended in the 1990s, as a judge on the tribunal on the Rwanda genocide, which broke new ground in prosecuting the crime of genocide and treating mass rape as a form of genocide. Ms. Pillay later served as a judge on the International Criminal Court, the U.N. High Commissioner for Human Rights, and a substitute judge of the International Court of Justice. The prize, however, was not welcomed everywhere. Speaking at a rally in Syracuse, New York, on Friday evening, President Trump spent about 10 minutes attacking the decision, describing Ms. Pillay as a \"mystery person\" he had never heard of and warning Norway that he would not forget it. On social media, he said he deserved eight Nobel Peace Prizes for the wars he claims to have settled, though some of those conflicts continue and others were ended largely by other parties. The chairman of the Norwegian Nobel Committee replied calmly, saying the panel is independent of the government and bound only by the will of Alfred Nobel. Ms. Pillay, for her part, had already joked to an applauding crowd in Nuremberg that if they kept clapping, she might share the prize with Mr. Trump.",

        plainText: "Superstar podcasts are Silicon Valley's way of talking to itself — 2026/10/11 Superstar podcasts are Silicon Valley's way of talking to itself 2026/10/11 Superstar podcasts are Silicon Valley's way of talking to itself 马斯克、奥特曼、黄仁勋都在上：播客为什么突然成了硅谷最值钱的流量入口？ EACH WEEKDAY morning Jordi Hays and John Coogan, two entrepreneurs-turned-podcasters, enter a sauna in Los Angeles with copies of the Wall Street Journal. They come out with jackets, ties and hot takes on the tech news of the day. Then they go on air as hosts of the \"Technology Business Programming Network\" (\"TBPN\") podcast, riffing with guests, banging gongs and blowing airhorns. Silicon Valley laps it up. It is not uncommon to see \"TBPN\", rather than CNBC, streaming on the TV screens in tech firms' offices. Podcasts are the latest example of a power law in Silicon Valley. Only a few become big hitters. Those that do attract the demigods of tech as guests, making them even more influential. \"TBPN\" has interviewed Sam Altman of OpenAI and Mark Zuckerberg of Meta. The \"All-In\" Podcast, hosted by four plutocrats who straddle tech and MAGA politics, held a summit in Los Angeles in September attended by Elon Musk and Jensen Huang. (When Donald Trump phoned Nvidia's boss on stage during the summit, Mr Huang put the president on speakerphone.) All share an in-crowd mystique bordering on incestuousness. In April OpenAI reportedly spent $100m-200m to buy then-18-month-old TBPN (though there was no mention of the affiliation during Mr Altman's interview). The \"All-In\" hosts are self-described \"besties\" with many of their billionaire interviewees. They are also an echo chamber, with a tin ear at times to the concerns of the rest of America. This new podcasting elite reflects a big change in Silicon Valley's relationship with the media. During the last great investment boom, the dotcom era of the 1990s, publications like Wired were tech-industry gospels. They covered the internet like Rolling Stone wrote about rock'n'roll, says John Battelle, a founding editor of Wired: \"We thought we were covering the counterculture.\" But the rise of social media and the growing power and wealth of big tech generated a rift between Silicon Valley and news outlets. Podcasters, who share their guests' techno-optimism, provide a friendlier platform. The watershed came during the 2024 presidential race. Led by Mr Trump, politicians saw the medium as a less filtered way of getting their message out than the press or broadcast TV. Two of its billionaire co-hosts, David Sacks and Chamath Palihapitiya, threw a fundraiser in San Francisco for Mr Trump. Shortly afterwards he appeared on their show. That helped raise the profile of the hosts, as well as of tech podcasting in general. Helping them thrive is what would be called, in Silicon Valley jargon, a flywheel. Just before he hit the big time in 2024, Mr Patel tweeted his bank balance. It showed savings of $0.14. Then Mr Zuckerberg came onto the show and the advertising dollars poured in. As more prominent executives take part, not only do advertisers notice; so do potential customers, investors and jobseekers, raising the quality of the audience. \"This is luxurious media with very valuable eyeballs,\" says Josh Kaplan, boss of Smooth Media, which represents podcasters. The format is particularly well-suited to Silicon Valley, where founders invent stories for a living. \"We're not journalists; we are enthusiasts,\" says Patrick O'Shaughnessy, whose podcast, \"Invest Like the Best\", has a strong following in VC circles. These offerings may be popular, but do not expect them to invest in the costly investigative work that uncovers frauds, such as that at Theranos, a health-tech startup, exposed by the Wall Street Journal in 2015. Instead, AI is at the centre of their discussions. Unlike many parts of America, they treat it as almost the only topic worth discussing. But this obsession has further pushed Silicon Valley into a \"monoculture\", says David Senra, an influential podcaster. Recently he has been to tech dinners where conversation veers only between AI optimism and doomerism. \"It sounds like they are all reading the same tweets,\" he says. Lulu Cheng Meservey, a PR consultant to tech founders, reckons nine-tenths of people in tech speak only to other people in tech. Podcasts exacerbate that. They may be well-meaning, she says, but \"when a billionaire AI salesman is telling you whether to buy AI, you are taking that from someone who is entirely unrelatable to you.\" It may get worse. Silicon Valley's podcasters sprinkle their conversations with reverence for space missions, robots and other techno-wizardry. In an Alpocalypse, they would come out better off than most people. Mr Battelle calls it the \"golden ticket on the rocket ship\". If all else fails, they can podcast from Mars. But will people still want to listen to them?",

        plainText: "What Experts Want to Know About the Russia Plague Scare — 2026/10/10 What Experts Want to Know About the Russia Plague Scare 2026/10/10 What Experts Want to Know About the Russia Plague Scare A 28-year-old worker at a research laboratory in Siberia recently died of pneumonia. The facility studies plague, among other pathogens, raising fears that she had been exposed at the laboratory. But Russian health officials so far have not linked the death of the worker, Darya Shipilova, to infection with Yersinia pestis, the bacterium that causes plague. And despite early reports that dozens had been quarantined near the research facility, health officials said that there was no risk of an epidemic. Still, the death has prompted concerns around the world, in part because of the Soviet Union's long history of advanced bioweapons research, which led to outbreaks of anthrax and smallpox. After unconfirmed reports of a second unusual case of pneumonia in the region, the World Health Organization sought additional information from Russian officials. President Trump said he planned to speak to President Vladimir V. Putin of Russia \"very soon\" about the death. Early reports cited local officials saying that Ms. Shipilova was exposed to Y. pestis during her work at the Irkutsk Anti-Plague Research Institute of Siberia and the Far East. Y. pestis was responsible for two of history's deadliest pandemics: the Black Death and the Plague of Justinian. As a lung infection, plague is contagious, although not as infectious as some other respiratory infections. (The bacterium also infects the bloodstream and lymph nodes.) In its early stages, plague can be successfully treated with antibiotics. There are hundreds of cases each year, mostly in Africa, according to the W.H.O.. Russian health officials said that Ms. Shipilova had died of pneumonia of unknown cause. While plague can lead to pneumonia, the filling of the lung's air sacs with fluid, it can have many other causes, including seasonal flu. \"Unfortunately, young people can die from pneumonia, so that development alone wouldn't be enough to raise concern,\" said Dr. Tom Inglesby, an epidemiologist at Johns Hopkins Center for Health Security. \"What I do think is concerning is the Russian reaction so far.\" More than 200 people who had been in contact with the deceased were quarantined in local hospitals, and Russian officials have not explained why, Dr. Inglesby said. Nor have they announced the cause of death, if not plague. Lab accidents can and do happen, even when researchers are following safety protocols. But the lack of transparency surrounding the death and the number of people potentially exposed is unusual, other experts said. \"Something is not adding up about this situation,\" said Jennifer Nuzzo, an epidemiologist at Brown University. \"You don't quarantine 200 people for one plague case,\" she added. \"You don't close multiple hospital units in response to one infection.\" After an unusual infection like this, health officials often provide the genome sequence of the virus or bacterium involved. This helps researchers pinpoint exactly which pathogen is to blame and how to fight it. Public health experts suspect that Russian officials have already sequenced the pathogen involved in Ms. Shipilova's death, and they wonder why that information has not been made public. \"Without that, the risk is uncertain, and I think we should be putting pressure on Russia to share the genome sequence,\" said Dr. Raj Panjabi, a physician and former White House biosecurity official. \"If Y. pestis is confirmed and the presentation was pneumonia, the likely route is inhalation of an infectious aerosol during laboratory work,\" said Dr. Tom Frieden, a physician and former director of the Centers for Disease Control and Prevention. But until more information is released, he added, \"anyone claiming to know more is guessing.\" Thanks to safety protocols and modern personal protective equipment, exposures to pathogens in labs are not common. Y. pestis is a particular concern, Dr. Frieden noted. It requires that laboratories maintain a certain airflow, HEPA filtration, respiratory protection, precautions against aerosols, trained staff members and health monitoring. \"Done right, it's safe,\" Dr. Frieden said. \"The problem is that 'done right' is not verifiable, and it's not easy.\" The last time a fatal exposure to Y. pestis occurred in a laboratory environment was in 2009, when Malcolm Casadaban, a biologist at the University of Chicago, died after contact with a weakened form of the bacterium. When accidents do happen, Dr. Panjabi said, it's important to have a system in place to characterize the outbreak, including how fast the threat is moving, who is at risk and what options are available to mitigate that threat. \"The larger issue of maintaining biosafety in high consequence labs that study dangerous pathogens is a national security issue in every country,\" Dr. Panjabi said. \"And it needs more attention.\"",

        plainText: "Inside the Nobel Prize in literature — 2026/10/09 Inside the Nobel Prize in literature 2026/10/09 Inside the Nobel Prize in literature Alfred Nobel was a keen but mediocre writer. The Swedish dynamite tycoon wrote unpublished poems and a play featuring a 40-minute torture scene. To the dismay of relatives keen to inherit his fortune, his handwritten will of 1895 endowed five awards, including a prize for literature. Nobel instructed \"the Academy in Stockholm\" to give it to the writer of \"the most outstanding work in an ideal [idealisk] direction\". The Swedish Academy spent decades puzzling over what \"ideal\" meant, before quietly dropping the criterion. Next Thursday, a door will open in a gilded hall in Stockholm and the Academy's formally dressed permanent secretary will step forward to announce, in Swedish and English, the winner of this year's literature Nobel. Now prediction markets favour Indian writer Amitav Ghosh, the Chinese avant-garde author Can Xue or the American novelist Thomas Pynchon to win the SKr12mn (£910,000) in prize money — though nobody really knows, as today's Academy is less leaky than it was before a #MeToo scandal prompted a sweeping overhaul. And the pundits usually guess wrong. The prize is ritually mocked. The Nigerian poet Chinweizu Ibekwe once marvelled at \"the conceit that a gaggle of Swedes... should pronounce on intellectual excellence for the whole wide world\". And yet, says Daniel Medin, professor of comparative literature at the American University of Paris: \"The Nobel is the big one for international fiction. There is no comparison.\" The Nobel shapes the global canon — even if the globe can push back. There has always been a comic discrepancy between the weight of the prize and the parochialism of the judges. The Academy's 18 life members — known as \"The Eighteen\" — are Swedish writers, literary historians, linguists and a jurist, some of them obscure even in Sweden. There were barely any female members until this century. The very first award, in 1901, made international news. Somehow nobody nominated Leo Tolstoy, whereas 17 members of the Academie Francaise endorsed the French poet Sully Prudhomme, and he won. The literature prize has never been as controversial as the frankly political Peace Prize; but because greatness in literature is more subjective than in the sciences, the Academy's choice reliably angers critics. They delight in drawing up lists of overlooked greats — James Joyce, Franz Kafka, Virginia Woolf, Marcel Proust, Constantine Cavafy, et cetera — though some of these achieved renown only after death. The prize was at its most politicised during the cold war, when the Academy chose the unreliable Soviet writer Boris Pasternak (1958) and dissidents Aleksandr Solzhenitsyn (1970) and Joseph Brodsky (1987). Pasternak initially accepted the nobelevka, as the award is popularly known in Russia — but then, under pressure from the regime, rejected \"this undeserved prize which has been presented to me\". Jean-Paul Sartre, who refused the Nobel in 1964, noted among his reasons that the prize was \"reserved for the writers of the West or the rebels of the East.\" By the 1980s, the Academy — earlier than most of the Western literary establishment — began looking beyond the west. A \"Nobel committee\" of four or five academicians whittles down the nominations to a shortlist of five, which the Eighteen spend the summer reading. They decide in early October. Translation has become central to the award. The Nobel has helped make the international canon more inclusive. After going global, the prize has recently become gender-equal. This followed a #MeToo scandal in 2017, when 18 women accused the French husband of Academician Katarina Frostenson of sexual assault and rape. He was later jailed. Several members quit — although the body's rules forbid resignation — and the post-scandal \"Eighteen\" included many more women. They awarded the 2018 prize, a year late, to Polish writer Olga Tokarczuk, and there have been three female laureates since 2018. In fact, notes Kaj Schueler, author of a Swedish book on the prize, there's been a precise pattern: male and female victories alternate. If that continues, then after Krasznahorkai's win in 2025, this year's laureate would be a woman, perhaps it will be Xue's year? The winners' reactions are part of the award's lore. John Steinbeck in 1962, when asked whether he deserved the Nobel, replied, \"Frankly, no.\" Many critics agreed. Samuel Beckett (1969) was on holiday in Tunisia with his wife Suzanne when a telegram from his French publisher arrived: \"In spite of everything, they have given you the Nobel Prize. I advise you to go into hiding.\" Suzanne, when told the news, exclaimed, \"Quelle catastrophe.\" Beckett dubbed December 10, the annual date of the award ceremony, \"Nobloodybeldamday\". Bob Dylan, winner in 2016, ignored the Academy's phone calls and didn't acknowledge the prize for over a fortnight.",

        annotatedPath: "/outward-reading/articles/2026/10/2026-10-08_001.annotated.html",
        plainText: "Why Does Anyone Care About the Nobel Prize? — 2026/10/08 Why Does Anyone Care About the Nobel Prize? 2026/10/08 Why Does Anyone Care About the Nobel Prize? \"Just go to sleep,\" Martin Chalfie's wife told him late one October night in 2008. Chalfie, a Columbia University chemist, had co-authored an influential paper describing a new method for studying cells with green fluorescent protein, and he was anxiously waiting to see whether it would be recognized. His wife, a fellow academic, tempered his expectations. \"It's a wonderful tool, and lots of people use it,\" he recalls her saying. \"But, to tell you the truth, it will never win the Nobel.\" So when the call from Sweden came in, Chalfie was asleep. This past week, the 2024 Nobel class was introduced to the world, creating a new crop of Olympian figures. Chalfie might tell you that the award hasn't changed his day-to-day life all that much, that his grant applications still sometimes get denied. But the medal radiates from his chest even when he's not wearing it. The Nobel is the honor above all honors. The achievements it rewards—in science, literature, and peace—contribute \"to the greatest benefit of mankind,\" a tagline any other respectable award committee would be too shy to claim. How did a single award from the small nation of Sweden become the undisputed highest honor in the world? Establishing a prize is easy. The hard part is getting anyone to care. Alfred Nobel, a businessman who made his fortune selling dynamite and explosives in the 19th century, was not an obvious candidate to become the namesake of the most prestigious distinction in the world. For the Nobel to become the Nobel, a few people had to get a few things really right. When rich individuals bequeath all their wealth to something other than their would-be heirs, their would-be heirs tend to resist. The Italian businessman Jerome Ponti, for example, had more or less the same vision as Nobel. But after his surviving relatives learned that he had donated his fortune to national academies headquartered in London, Paris, and Vienna in 1874, a group of them successfully litigated to void the will. In the 1890s, the executors of Nobel's estate had to be a bit more clever. They preemptively reached an agreement with Nobel's two living nephews, one of whom was particularly gracious and persuaded the rest of the family to honor the late Nobel's wishes. A second reason the Nobel prevailed over prizes of similar ambition was that Sweden turned it into a nationalist project. Nobel himself did not mention anything about Swedish interests, but the government and the press interpreted his bequest as a call to action for the nation as a whole. \"The Swedish scientific society could not have been invested with a more glorious task,\" a newspaper editorial declared. The effort turned out to be well timed. In the early 1900s, a new prize in Sweden might have seemed unlikely to compete in prestige with one given by the French Academy of Sciences or the Royal Society in London. But when World War I struck, neutral little Sweden had a claim to objectivity that the great powers didn't. Finally, both Nobel and the executors of his will designed the rules wisely. Most prestigious prizes at the time were international only in theory; judges tended to favor their countrymen. Nobel requested that each award be given to the \"worthiest person, whether or not they're Scandinavian.\" The Nobel Prize committee became the first to systematically solicit nominations from institutions abroad, turning the award into a sort of contest among nations. And one of the executors of the will had the idea of rewarding achievements no matter when they had been made, rather than just the work or discoveries of the previous year. This was a clever move, not just because some discoveries can take time to reveal their worth, but also because it turned winning the Nobel into a more sweeping victory. Fortified with its elegant design choices, the Nobel quickly established a first mover advantage. The Scottish economist Angus Deaton told me that nothing comes close to the Nobel ceremony. On the night after he found out he won, Deaton couldn't keep the news to himself. He told his Uber driver on the way home from dinner in Princeton and watched him become ecstatically happy. The driver at first assumed that Deaton had won the peace prize; when he learned it was for economics, his enthusiasm dimmed, but only slightly. A Nobel is a Nobel. Prizes aren't all great. The main ideology the Nobel Foundation appears to be committed to, however, is the importance of preserving the prestige of the Nobel Prize—and in this it has succeeded. If there were a prize for prizes, the Nobel would win every year.",

        plainText: "China cultivated high-rolling crime families before turning on them — 2026/10/07 China cultivated high-rolling crime families before turning on them 2026/10/07 China cultivated high-rolling crime families before turning on them A Post investigation found that criminal networks in Myanmar enjoyed the protection of Chinese officials as well as the military government in Myanmar. For the scion of a crime family linked to human trafficking and enslavement, money laundering and global cyberscams, Wei Qingtao was brazenly public. His Douyin account, the Chinese-language version of TikTok, flaunted the excesses of his life in a remote corner of Myanmar by the border with China: Bentleys and Lamborghinis, rare cigars and private jets. When the 27-year-old partied at the multistory glass-walled nightclub he owned in a region called Kokang, he'd throw crisp Chinese yuan bills into the crowd. In November, the good times rolled to a stop. Wei's social media presence vanished. He soon appeared in a different kind of video: reading a scripted confession while in Chinese custody. \"The money we make from cyberscams comes from the pensions of everyday Chinese people,\" Wei said. \"This time, the Chinese government has made up its mind. ... We must not cling to any illusions.\" Within weeks, his uncle was in cuffs on a plane to China, flanked by dozens of police officers. The clans controlled every aspect of life in Kokang, becoming lawmakers, militia heads, local administrators and powerful business executives. But at the heart of the Kokang empire were casinos, underground banking and money laundering, according to U.N. officials and U.S. diplomatic cables released by WikiLeaks. Newly built mega-casinos in the Kokang capital, Laukkaing, opened 24 hours a day. Behind the vast casino floors, a more sinister industry started to grow. Chinese court documents show that from at least 2018 \"criminal syndicates\" were smuggling people into the Crouching Tiger Villa, a banquet hall and hotel, and forcing them to work as scammers. Border closures that followed the outbreak of the coronavirus pandemic shut off the cash flow to the casinos, accelerating a shift to this new scam economy. Workers, mostly Chinese nationals or ethnic Chinese, were bought, sold and traded; and then beaten, tortured or killed when they didn't reach financial targets or tried to escape, according to firsthand accounts. Many of the compounds for running scam operations were hosted in the same hotels and casino complexes long established by the clans. Others were purpose-built, but had telltale signs like barred windows, high walls and even Myanmar military snipers on the rooftops, witnesses said. A handyman, hired to build soundproof phone booths within a scam compound in a hotel owned by the Liu family, said he was interrupted by screams as he worked. He said he saw a supervisor beating three men, their hands tied behind their backs, with lead pipes. A Taiwanese woman, who was trafficked into Laukkaing, told The Post she was waterboarded when she tried to escape. A Chinese man, who was forcibly brought into Kokang by knife-wielding men after responding to an acting job online in China, said he saw others in his compound chained and beaten. At one point, four people were shot when they fought back during beatings and tried to seize guns from the guards, he added in an interview. The Crouching Tiger Villa was among the most brutally run compounds, witnesses said. There, caged lions, tigers and bears were used to threaten workers who stepped out of line, according to a person who led a team of workers there. By 2023, Beijing was coming under growing domestic and international pressure to act against these operations. The United Nations estimated in a report last year that more than 120,000 people were being forced to work in Myanmar. Signs of official Chinese concern burst into the open in August when the Chinese ambassador warned Myanmar authorities to \"eradicate the cancer of gambling and scams\" that was \"deeply loathed by the Chinese people.\" At the Crouching Tiger Villa on Oct. 20, guards opened fire when more than 100 people tried to leave. The Post could not verify how many died, but four undercover Chinese police officers were among those killed. Confession videos featuring Wei Qingtao and two others — individuals from the Liu family and the Ming family — began to appear on Chinese media. Two of the Mings were arrested in Myanmar by local police and handed over to China. In December, China issued arrest warrants for 10 more heads of the Bai, Wei and Liu families, and their children. On Jan. 6, Laukkaing, the capital of Kokang, fell to the MNDAA, returning full control of the region to the rebel group for the first time in 15 years. Since last July, 49,000 scam workers have been returned home to China, according to the Ministry of Public Security. The casinos and hotels owned by the Kokang crime families still stand, but have gone dark. Hanley Interstellar, Wei's club, is deserted. So too is the Crouching Tiger Villa, its walls crumbling and pockmarked with bullet holes, verified videos show. But some of the exotic animals — a tiger and five bears — survived the conflict. They still roam their cages, depending on rebel soldiers to bring their daily meal of chicken.",

        plainText: "The AI industry is booming. Women are getting left behind — 2026/10/06 The AI industry is booming. Women are getting left behind 2026/10/06 The AI industry is booming. Women are getting left behind There's a common fear among people who work in Silicon Valley: snag one of the fast-growing, high-paying jobs in artificial intelligence, or get trapped in the \"permanent underclass\", a phrase describing the fate of those who won't have upward mobility in the age of AI. The phrase usually describes a future in which AI automates human jobs. But for women in tech, it's starting to look like the present. \"A lot of people say: 'Oh, AI is lowering barriers, it's equalizing the playing field for women,\" said Urvashi Batra, co-founder and CEO of Prioriwise, an AI platform for IT service providers. \"I actually think it's the opposite.\" Batra said people take her less seriously as the founder of an AI company than her male co-founder. When pitching investors, she and her co-founder have learned that they are more likely to get an investment if he does the pitching. Women made up only about a quarter of new hires in AI roles in the last year, compared to 50% of new hires in non-AI roles, according to a recent report from LinkedIn. In executive roles, that number drops to just 13%. At the same time, LinkedIn's research shows that women are more likely to work in roles with high exposure to AI disruption, like customer service, meaning they are also at higher risk for job loss due to AI. AI jobs, whose postings have doubled since 2023, come with a salary premium, on average paying more than twice as much as roles that don't involve working with AI. But women who do have jobs in AI are disproportionately concentrated in low-paying roles, like data annotators. Across all AI occupations, men have $45,000 higher median pay than women, partly due to the types of jobs they are likelier to have. The ongoing trend could produce the greatest gender pay gap in generations and leave women out of building a technology that shaped the economy. \"What we're witnessing is a sort of backsliding,\" said Brenda Darden Wilkerson, president of AnitaB.org, a non-profit devoted to advancing women in tech jobs. Initiatives to promote women in the tech industry have been ongoing for years, with mixed results. Women now hold about one-third of tech jobs in the US. But research has found that women leave the tech industry at a much higher rate than their male counterparts, citing factors like non-inclusive cultures and barriers to advancement. Women working in AI may face even greater challenges. \"AI moves extremely fast, and the pressure to keep up is immense,\" said Jayeeta Putatunda, an AI engineering lead at investment firm Turing. \"I have seen throughout my career so many amazing women I know kind of fall through the cracks.\" Putatunda said it's not uncommon to be the only female engineer on a team, and that when women are outnumbered, they have to speak up louder to make their ideas known. Mentorship in the AI field, especially by other women, can be hard to come by. And the breakneck pace of AI advancements means anyone working in the field should expect to put in long hours in order to keep up. Those kinds of work expectations can make it impossible for everyone to stay in the field. \"I went on maternity leave for four months, and by the time I came back, there were completely different frameworks and levels of models,\" Putatunda said. Getting caught back up was overwhelming. She said it was only possible with the help of supportive co-workers and a husband who equitably split childcare. The AI industry is so new and fast-moving that it should in theory be more meritocratic. No one has a decade of experience working with a model developed one year ago, which should mean everyone has a level playing field. But instead the field has indexed more on personal networks and other loose signals, according to some women who work in AI. The political climate has made it more challenging to get AI companies to support initiatives focused on women, said Felicia Newhouse, founder of AI Powered Women, an organization that promotes women's participation and leadership in AI. Newhouse, a product marketer who has worked in technology companies for two decades, points to the Department of Justice targeting corporations with DEI programs, claiming the initiatives violate anti-discrimination laws. Still, she said the risk that women are left behind in the AI workforce was something that kept her up at night. \"We're talking about who captures a major new source of economic mobility,\" she said. \"The deepest risk is that a participation gap becomes a power gap.\"",

        annotatedPath: "/outward-reading/articles/2026/10/2026-10-05_001.annotated.html",
        plainText: "Investing for babies involves knotty trade-offs — 2026/10/05 Investing for babies involves knotty trade-offs 2026/10/05 Investing for babies involves knotty trade-offs Patience, consistency and frugality are fine habits for an investor. They are not, however, common virtues among newborn babies. The little bundles of joy are impulsive short-term thinkers. They are also some of nature's biggest freeloaders, living entirely beyond their means. All the same, for new parents with a soft spot for the magic of compounding, like your columnist, a baby presents a tantalising investment opportunity. Many decades of life and potential returns stretch out into the future: $1,000 invested today with a real annual return of 5.2% (the average for global stocks over the past 125 years) would be worth $58,000 by the time the child is 80. Yet these juicy financial returns must be considered alongside another sort of investment: in the children themselves. Spending on a child's health, education and skills can yield even higher returns (on top of helping them lead a fulfilling life). So how should a new parent think about their budding little portfolio? Potential financial investments are manifold. Many countries offer tax-advantaged ways for parents to save for their children. American tykes are now eligible for Trump accounts, which start with a $1,000 freebie from the federal government that can be put into mutual funds or index trackers until the child turns 18, while taxes are deferred. Earlier options include the even more tax-friendly 529 accounts, but these may be used solely for specified educational purposes. In Britain, the Junior Individual Savings Account, into which up to £9,000 ($11,900) a year can be invested, is tax friendlier still. Investing for babies is a joy even without the tax perks. Long horizons smooth out volatility, allowing for more risk. Ian Ayres and Barry Nalebuff, two economists, propose that young workers should borrow to buy stocks, since the long-term returns to equities are (hopefully) higher than the interest on borrowing. If the logic is true for 20-somethings, it is truer still for infants with a horizon a couple of decades longer. Some parents fear that creating a large trust fund will turn their offspring into layabouts. Andrew Carnegie, a 19th-century American steel magnate, gave away most of his wealth out of fear that it would dull the work ethic of his descendants. A more recent study of Norwegian inheritances between 2000 and 2004 found that those bequeathed NKr300,000 (some $40,000 at the time) or more reduced their working hours by 7-10% in the six years that followed. This makes investments in human capital more appealing. In the 1970s and 1980s Gary Becker and Nigel Tomes, another pair of economists, theorised that parents were better off investing in education and skills early on. For example, teaching a child to read is not hugely expensive, but opens up huge opportunities for future earnings. Investing in financial assets starts to make sense later, once those human-capital investments encounter diminishing returns. A wealth of empirical evidence has since backed up the theory. Beyond basic skills, however, investing in human capital gets fraught. Such investments are sunk costs that cannot be liquidated. They are also infungible: tutoring in advanced maths is not the same as Chinese lessons. Children react differently (and unpredictably) to each. The extraordinarily long timeframes that make investing for babies attractive also raise uncertainty. Perhaps the skills that are valuable today will be obsolete in an AI future? So what is a new parent to do? The most obvious financial options involve accepting free money. The $1,000 in a Trump account is a no-brainer. Even rabid anti-Trumpers would be mad not to take it. All parents should also accept similar grants from several American states. Those who expect to be on the hook for university tuition would be wise to take advantage of 529 accounts or similar vehicles as early as possible, so that compounding can work its magic to the full. Any money that children are likely eventually to inherit is better off in tax-friendly shelters than in their parents' brokerage accounts. Investments can misfire: violin lessons may generate little more than screeching and even a modest trust fund could encourage laziness. But with a bit of luck, investing in a child's future and on their behalf will pay off handsomely. Fortunate parents with the ability to do both should approach this like the rest of parenting: try different things and don't agonise too much over your decisions.",

        title: "A hurricane is coming to tax systems",
        publishDate: "2026-10-04",

        annotatedPath: "/outward-reading/articles/2026/10/2026-10-04_001.annotated.html",
        plainText: "A hurricane is coming to tax systems — 2026/10/04 A hurricane is coming to tax systems 2026/10/04 A hurricane is coming to tax systems THE YIELD on ten-year US Treasuries has charged through the 5% barrier. The spread between French government bonds and German Bunds is at levels not seen since the euro-zone crisis in 2012. Britain's newish prime minister has this week set out a plan for spending bolstered by a taboo-busting promise to curb state-pension increases—and yet is still in a fiscal pickle. Across the rich world, countries are struggling to coax more growth out of their economies. And that's not the worst of it. As we explain this week, the tax base in all countries, which depends heavily on taxing labour, may be upended by artificial intelligence. Add these problems together, and it is as if a mighty hurricane were about to hit the rich world's tax systems—which are hopelessly unprepared. The way the state raises money is wasteful, unfair and perverse. You would have thought governments would be scrambling to strengthen the system before the hurricane makes landfall, but as ever they are running away from tax reform instead. The accumulated flaws of modern tax systems are so ubiquitous that they have become part of the economic backdrop. Taxes are full of needless complexity. In Germany the rate of value-added tax (VAT) on oat milk is more than double that on cow's milk, for example. Such widespread special treatment has ruinous fiscal consequences. Across the OECD, a club of mostly rich countries, consumption taxes raise only 58% of what they could if there were no carve-outs and no evasion. Tax systems also create perverse incentives. When a parent in Britain increases their net income from £99,999 ($131,500) to £100,000, they automatically lose free child care worth thousands of pounds. This can prompt some of Britain's most productive workers to cut their hours or overstuff their pensions. And taxes are widely seen as unfair. In Britain the median employee pays 55% more tax than their self-employed counterparts. Many people feel the rich aren't doing their bit. In California voters will decide in November whether to charge a one-off 5% levy on residents with wealth of over $1bn. No one knows when the fiscal weather will turn. But rapid advances in AI could accelerate matters. Taxes on labour are the workhorse of most tax systems worldwide, raising around half of all revenue in the OECD. In the coming years AI could well displace workers or cut their wages even as corporate profits rise, shrinking labour's share of GDP. This in turn could reduce revenues and increase benefits payments, making deficits even harder to support. Optimists may hope that superfast growth will make the maths easier to handle. Yet The Economist has looked at what would happen in rich countries if labour's share of national income fell by ten points. By our calculations, Italy's budget deficit would double as a share of GDP and Germany and France would not fare much better. In addition, the capacity for tax avoidance would no longer be limited by human ingenuity. Point countless AI agents at Britain's 23,000-page tax code and hundreds of new tax-avoidance strategies are likely to emerge—and don't bet on the Treasury to keep up. What to do? Given that AI is likely to mint vast fortunes for a select few, countries may be inclined to follow California's proposal and introduce wealth taxes. Yet such taxes will probably backfire, either because they are too difficult to administer or because they cause rich people to flee. Previous attempts have proved unworkable. In 1990, 12 rich countries taxed fortunes; today just four do. A more fundamental overhaul is needed. Wealth should be taxed more via capital-gains taxes, which currently overpenalise normal returns and undertax supernormal ones. A start would be to introduce a higher headline rate and allowances that exempt normal returns. At the same time, the burden on labour should lighten. That would be a hedge against disruption from AI, and remove an obstacle to employment in countries where labour taxes are crushing. In Belgium they constitute 52% of the costs of employing a person. Consumption should be taxed more heavily, with a focus on ending the litany of exemptions. That would have the useful side-effect of taxing the spending of the very rich. This might not curb the influence Elon Musk can buy, but it would ensure the state gets a bigger cut when Mr Musk buys another plane. Finally, codes should be radically simplified. None of this will be easy. The losers will hiss more loudly than the winners will cheer. But change is coming, like it or not. The country that gets ahead of the hurricane will one day thank the politicians who had the foresight to act.",

        plainText: "A Near Disaster on Flydubai — 2026/10/03 A Near Disaster on Flydubai 2026/10/03 A Near Disaster on Flydubai This unbelievable sequence of events has huge implications. Today, somewhere over Saudi Arabia, the co-pilot of an Israel-bound Flydubai Boeing 737 stabbed the other pilot and pitched the nose of the plane toward the desert below. The jet descended 17,000 feet in two minutes, at an acceleration violent enough to make your phone and in-flight snack jump off your tray and be pinned to the ceiling. Other crew members and at least one Israeli passenger broke into the cockpit and subdued the assailant. Relief pilots then took over and landed the plane in Tabuk, Saudi Arabia. After a second Flydubai plane took the 174 passengers to Tel Aviv, one of the passengers who’d stormed the cockpit told Israeli Prime Minister Benjamin Netanyahu that his actions had been effective in part because he had watched the disaster-porn documentary series Mayday, about aviation catastrophes, and had known to pull back on the yoke. Whether today’s near-disaster was terrorism or merely attempted mass murder depends on the attacker’s motive. Either way, it is a public-relations catastrophe for Flydubai, the budget cousin of the airline Emirates. Since the United Arab Emirates opened diplomatic relations with Israel in 2020, the airline has connected the two countries with few interruptions, even for acts of war and terror. Keeping that air route open and safe has taken a great deal of effort. Last year, I witnessed clever security engineering at Dubai’s terminal 1: placement of the check-in desk for El Al, the Israeli carrier, adjacent to the desk for Iran’s Mahan Air. Anyone tempted to attack Israeli passengers would hit Iranian ones, and vice versa. Checked baggage costs extra, but the experience of being a human shield while waiting in line is complimentary. Mahan Air no longer flies into Dubai. U.S. sanctions have halted much of its operations, and Dubai had already curtailed its flights, on the grounds that Iran can fly either missiles into Dubai or commercial flights, but not both. Israel, by contrast, has emerged from the 2026 Iran war closer to the UAE, which has absorbed more Iranian attacks than any other country. Although the Arab countries of the region have been allied as the Gulf Cooperation Council since 1981, that alliance proved useless as soon as the missiles and drones started flying. But Israel responded as an ally, by sending defense systems and advisers. At least one Iranian strike during the early phases of the war hit near the Israeli consulate in Dubai. One possible political motive for the Flydubai incident would be to strain and punish the relationship between the two countries. The relationship between Israel and the UAE is unlikely to snap over a single attack. The relationship between the UAE and Netanyahu himself is more delicate. In the past several weeks, the president of the UAE, Mohammed bin Zayed Al Nahyan, was implicated in a report from Haaretz that severely damaged Netanyahu’s chances of remaining in office after next month’s Israeli election. The report alleged that days before the massacre of October 7, 2023, MBZ had personally warned Netanyahu that an attack was imminent but Netanyahu had done nothing to act on the warning. The UAE government at first refused to comment on the story. On Sunday, however, Netanyahu visited Abu Dhabi, and the AP reported that he asked MBZ to deny that he’d warned of an attack. Yesterday, in New York, UAE Foreign Minister Abdullah bin Zayed did exactly that. \"Sheikh Mohammed did not call Prime Minister Netanyahu and say there is going to be an attack on Israel,\" Abdullah said in a meeting at the Council on Foreign Relations, calling his denial \"categorical.\" He said that using a leader-to-leader call to pass along secrets was \"not our style,\" and he left open the possibility that a warning had been passed between governments, if not between leaders. This denial releases some pressure on Netanyahu without absolving his government of its failures. The New York Times and others have reported that the first officer who allegedly tried to bring down the plane is an Omani national. Both are reportedly still in Saudi Arabia. The next part of the story will involve determining whether the pilot acted alone—not a good look for Flydubai, to have suicidal or terrorist pilots—or at someone’s behest. The latter possibility could, if confirmed, have serious implications, depending on who directed the attack. Many have a motive: Sunni jihadists (al-Qaeda or the Islamic State), Hamas, and of course Iran and its proxies. This Mayday moment will have huge implications if any of these groups are involved.",

        plainText: "How gold surpassed cocaine as Peru's most profitable criminal industry — 2026/10/02 How gold surpassed cocaine as Peru's most profitable criminal industry 2026/10/02 How gold surpassed cocaine as Peru's most profitable criminal industry \"Halt, stop right there,\" shouts a Peruvian Navy Seal, firing warning shots into the air. But the fleeing man pays no attention, scrambling up to the rim of a football pitch-sized crater and disappearing into the dense rainforest as the commandos give chase, swearing and shooting. Meanwhile, other marines set dynamite charges on a makeshift wooden raft that floats in the crater, which is essentially an enormous pit of opaque, stagnant water. The raft has a diesel-fuelled suction pump motor with thick plastic tubing used to suck up and sift through river sediment for tiny particles of gold. Soon after, a mushroom of orange and black fumes envelops the trees – and seconds later comes the sound of the explosion, shattering the peace of the Tambopata National Reserve, one of Peru’s most prized Amazon parks. In total, more than 140,000 hectares have been lost to mining in Madre de Dios – a shocking 97.5% of the total deforestation caused by mining in Peru’s Amazon rainforest, an area twice the size of the US state of California. Military crackdowns on illegal mining in the Amazon are not new in Peru. But the skyrocketing international price of gold has caused this destructive activity to spread, empowering local gangs and attracting transnational organised crime. \"Dirty\" gold has become the country’s most profitable illicit industry, even surpassing drug trafficking in the world’s second-biggest producer of cocaine after Colombia. \"Gold prices have risen,\" said Gen Victor Cotrina, the military commander of Madre de Dios, who is leading the crackdown on illegal gold mining. \"That’s why, if a miner’s motor is destroyed, he’ll replace it quickly because gold is at its peak price: the very next day he’s back to his mining activities. He’s back at work again. \"For troops used to combating drug trafficking by targeting well-hidden plantations of coca, which is used to make cocaine, the fight against illegal gold presents new challenges as the end product is not an illicit drug but a legally traded commodity, Cotrina said. \"The difference is that an open-pit mining operation doesn’t require covert operations, whereas drug trafficking does.\" He said previous anti-mining crackdowns had been ineffective due to corruption and patchy enforcement. But now, with \"aerial surveillance and military personnel who are available 24/7 to conduct patrols, we are determined to eliminate mining in this region\". The evidence is not difficult to find or destroy. Behind the wall of green that marks the edge of the reserve, troops and environmental prosecutors set ablaze a network of well-supplied mining camps, built with timber and blue tarpaulins and stocked with food and beer. A lone cockerel crows as the abandoned camps go up in flames. Two women had been left behind by the fleeing miners: Andrea, 30, wept as she begged the officers not to arrest her, explaining she was a single mother who had been working as a cook and could find no other work to support a sick mother and two children. Liz Compi, 20, was found sitting on a boat with her one-year-old son. She said she had taken the job as a cook for $450 a month after being abandoned by her partner and sacked from a previous job. The dirty gold departs Peru as contraband to Bolivia and Brazil, but much of it is laundered into the legal trade via a controversial registration system called Reinfo. The system, in theory, should bring informal miners into the legal economy, but critics say it allows them to continue working without environmental permits and laundering illegal gold through formal companies. The trade is so lucrative that members of Congress have backed five repeated extensions of Reinfo, despite pushes to reform or eliminate the registry. Since the beginning of Covid-19 pandemic, the price of gold has tripled. Tens of thousands of miners have poured into protected Amazon parks and Indigenous reserves, stripping away vast tracts of rainforest and leaving behind a denuded, pocked terrain, stagnant pools and disrupted river courses. Mercury is the cheapest and easiest way to extract gold because it binds with the particles in the river sediment. \"The government’s response is moving very slowly,\" said Flores after another day of relatively fruitless jungle raids, destroying camps that are likely to spring back up soon after. \"Meanwhile, illegal mining operates 24 hours a day. The miners measure time in grams, not minutes, so we need to rethink how we investigate mining,\" he said.",

        title: "A SpaceX Starship Rocket Officially Reached Orbit. Why That's So Significant",

        readingPath: "/outward-reading/articles/2026/10/2026-10-01_001.reading.html",
