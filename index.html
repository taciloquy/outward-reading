        annotatedPath: "/outward-reading/articles/2026/09/2026-09-16_001.annotated.html",
        plainText: "HYROX Beijing faces backlash after Aussie athlete continues race despite soiling herself — 2026/09/16 HYROX Beijing faces backlash after Aussie athlete continues race despite soiling herself 2026/09/16 HYROX Beijing faces backlash after Aussie athlete continues race despite soiling herself The organisers of a viral sporting event in Beijing have faced backlash and criticism after an Australian woman was allowed to continue competing after soiling herself. Athlete Joanna Wietrzyk was participating in the global indoor fitness race HYROX in the Chinese capital at the weekend when she suffered a bout of faecal incontinence. Wietrzyk was allowed to finish the course and won her event, with videos and photos posted online showing her continuing through demanding exercises and using communal equipment while visibly soiled. Wietrzyk, who is a HYROX world record holder, was invited to compete at the Beijing event. In just four months, Joanna Wietrzyk has gone from discovering HYROX to dominating it. \"I didn't even know what HYROX was four months ago,\" Wietrzyk admits. But with a background in competitive tennis and distance running, she's adapted fast. The incident has gone viral on Chinese social media and sparked debate about HYROX's health and safety standards, as well as athlete responsibility. \"She's so selfish — she kept running the whole way even though she had diarrhoea,\" one user on Weibo questioned. \"What about the runners behind her?\" Another wrote: \"The host is ultimately unprofessional! \" On Weibo, the hashtag #Hyrox incontinence female competitor has not been punished# has more than 27 million views. An article on the Beijing incident was the most-viewed story on Chinese state media website the Global Times on Monday. After the race, she doubled down and even shared a selfie on Instagram, which has since been deleted, appearing to show her in a hospital bed. \"Go hard or go home...a win is a win.\" Footage and images of the incident subsequently spread across social media and fitness forums, with reactions ranging from praise for Wietrzyk's determination to concerns around hygiene. HYROX is a global fitness challenge in which participants race to complete often gruelling stations, including sandbag lunges, burpees, sled pushes and rowing. In a statement, HYROX China said the area was decontaminated after the race had finished. \"After the incident, the organising committee immediately closed off and isolated the affected area and track, and completed comprehensive disinfection,\" organisers said. \"Relevant equipment was removed from the venue, and waste was disposed of in accordance with municipal waste-management standards. \" The organisers also said they would replace flooring at the venue to protect future athlete health. HYROX World also issued a statement addressing the incident. \"HYROX has clear bio-contaminant and medical procedures in place,\" the statement said. \"In this instance, an unforeseen situation arose in which protocols designed for elite competition and mass participation became blurred, creating ambiguity in how they were applied and understood. \" But social media users and other athletes at the event have attacked the response and questioned why Wietrzyk was allowed to finish the race, potentially risking the health and safety of other competitors. \"For people who were exposed to that situation, there could be genuine physical and psychological consequences,\" one competitor named johopalooza posted on Instagram. \"I paid HYROX to provide a professionally organised and safe event. So while I understand the athlete perspective, ultimately my contract and expectation is with HYROX. Protecting athletes is important, but showing the wider community that HYROX takes responsibility when its own procedures fail is just as important. \" HYROX has also been accused of double standards over its hygiene rules, which punish athletes with time penalties if they litter on the course, spit or clear their nose onto the floor. Li Hongxin, an associate professor of sports management at China's Zhengzhou University of Light Industry, said the athlete should not be criticised or judged for experiencing a physiological problem. \"I think her determination and sportsmanship are very understandable,\" he said. But he said the incident raised questions about the responsibility of event organisers. \"Organisers should assess whether such a situation could affect the health or wellbeing of other competitors,\" he said. Dr Li said this was particularly important because HYROX was an indoor event. \"Take a marathon as an example. If a competitor is menstruating, organisers would generally respect their decision to continue because a marathon is an outdoor event,\" he said. \"They don't share equipment with other competitors, so it generally doesn't pose a public safety concern. But HYROX is an indoor event, where competitors share equipment. In that situation, I think the organisers should have staff step in and adjust the event, or take appropriate emergency measures.\"",

{
        title: "The Most Effective Way to Learn Is to Push Through It the Hard Way",
        publishDate: "2026-09-16",
        fileKey: "2026-09-16_002",
        source: "The Economist",
        cleanPath: "/outward-reading/articles/2026/09/2026-09-16_002.clean.html",
        annotatedPath: "/outward-reading/articles/2026/09/2026-09-16_002.annotated.html",
        plainText: "The Most Effective Way to Learn Is to Push Through It the Hard Way — 2026/09/16 The Most Effective Way to Learn Is to Push Through It the Hard Way 2026/09/16 The Most Effective Way to Learn Is to Push Through It the Hard Way There is a comforting myth about learning—that if you just find the right method, the right teacher, or the right shortcut, everything will suddenly become easy. People spend years searching for the perfect system, hoping it will eliminate struggle altogether. But the truth is far less appealing: real learning is not designed to feel easy. At its core, learning is a process of friction. It requires you to sit with confusion, to face what you don’t understand, and to stay in that discomfort long enough for clarity to emerge. This is what people often call hard learning—not because it is inefficient, but because it demands effort without immediate reward. When people avoid this stage, they turn to passive forms of learning. They watch videos, read summaries, highlight sentences, and feel productive. But passive exposure creates familiarity, not mastery. It feels like progress, but it rarely leads to real understanding. Hard learning looks very different. It is slower, quieter, and often frustrating. It involves rereading the same paragraph multiple times, attempting problems without knowing the answer, and failing repeatedly before getting it right. There is no instant gratification—only gradual improvement. One of the most important elements of hard learning is repetition. Not mechanical repetition, but deliberate repetition—returning to the same material with deeper attention each time. With every pass, your understanding shifts. What was once confusing becomes familiar; what was once familiar becomes clear; what was once clear becomes flexible. Another key aspect is active engagement. Hard learning requires you to think, not just consume. It asks you to explain ideas in your own words, test your understanding, and apply knowledge in new contexts. This is where knowledge transforms into ability. The difficulty of hard learning often discourages people. It feels inefficient compared to faster, easier alternatives. But what seems efficient in the short term is often ineffective in the long term. Learning that avoids struggle rarely survives beyond the moment. There is also a psychological barrier. Many people equate difficulty with failure. When something feels hard, they assume they are not good at it. In reality, difficulty is not a sign of inadequacy—it is a sign that learning is happening. If you look at people who achieve deep expertise in any field, their process is rarely glamorous. It is built on long hours of focused effort, repeated attempts, and a willingness to stay with complexity. They don’t avoid hard learning—they rely on it. So when people say, The best way to learn is to push through, it is not a rejection of good methods or smart strategies. It is a recognition that no method can replace effort. Techniques can guide you, but they cannot do the work for you. In the end, learning is not about avoiding difficulty—it is about building the capacity to move through it. And the sooner you accept that, the sooner your learning becomes real.",

        plainText: "Tech's New Rich Are Suffering From 'Sudden Wealth Syndrome' — 2026/09/15 Tech's New Rich Are Suffering From 'Sudden Wealth Syndrome' 2026/09/15 Tech's New Rich Are Suffering From 'Sudden Wealth Syndrome' It was the kind of exit every entrepreneur dreams about. Anastasia Koroleva and her husband sold for nine figures: 100% cash on Day 1, zero earnouts, no strings attached. But what followed blindsided the founder. Instead of the soft life she'd expected, Koroleva found herself dealing with years of unease and a painful divorce. Today, Koroleva explores what happens when net worth removes the need to work on Exit Paradox. Her interviews with the extraordinary wealthy have uncovered a recurring theme: For many, the exit does not feel like a crowning achievement — or, at least, not for long. It can feel more like an existential rupture. Guests describe becoming staggeringly rich using the language of trauma: \"recovering from a $500 million sale,\" \"thrashing about for a decade\" or drifting in a state of aimless ennui. Financial hardship defined Michia Rohrssen's earliest memories. At age 4, he remembers watching his mother cry over a failing car they had no money to fix. Money was \"this constant source of pain in our lives,\" he recalls. Rohrssen moved to San Francisco in his 20s and went into startups, co-founding automotive software firm Prodigy in 2015. Then, in 2021, when Rohrssen was 31, Prodigy sold for $110 million. All his money problems were solved. Rohrssen was elated — and although he never thought money could replace inner work, the existential dread that slowly set in turned out to be darker than the poverty he'd survived. \"It's really bad,\" he says. \"When you're broke and things are hard, you have this belief that, well, one day when I sell the company then things can get better. It's actually much harder when you've achieved those financial outcomes and you still feel just as broken. You feel just as inadequate, and you're like, 'But I did the thing? \" He traveled around a bit but had little purpose day-to-day beyond waking up to see his wife. \"I just died,\" he says. There's a term for this phenomenon — \"sudden wealth syndrome\" — says licensed psychotherapist Annie Wright. One reason is velocity. The time between starting a company and hitting a liquidity event has compressed dramatically since the crypto boom, leaving founders less time to mature alongside their wealth. Wright says another factor gets the least attention but can exact a heavier toll: the moral weight of how the wealth was made. Unlike lottery winnings, a founder's fortune is deeply intertwined with their identity. That makes the success feel earned — but any subsequent dissatisfaction feels painfully personal. Many fall prey to the arrival fallacy: the assumption that reaching the number, the milestone they'd organized their lives around, would deliver lasting peace. When it doesn't, some jump straight into their next venture — less from inspiration than a need to prove the first success wasn't a fluke. Parr founded The Hustle, a digital business newsletter by HubSpot in 2021. These days his focus is Hampton, where he dissects what he calls \"champagne problems\" — problems nonetheless. His best advice? Don't do anything irreversible for at least a year after exit. The money, at a certain size, also stops feeling real. \"Up to about $20 million, you're still thinking about, 'How do I use this resource well? \" says Walling, the psychologist. \"You kind of watch it and pay attention and make good investments. And then there's a number beyond that where it's kind of like Monopoly money. That can have this delusional effect on someone's psychology. They are unmoored and unanchored to the value of anything. \" Finding that equilibrium can take years. Of roughly 1,200 post-exit stories Koroleva has studied, she estimates that a decade after reaching \"post-economic\" status, 15% are \"in a pretty sad place\"; 70% are comfortable but feel some emptiness; and just 15% are thriving. Walling says the people who handle a windfall best tend to hold two ideas at once: \"I worked really hard, and I got really lucky. \" Reward without inflated self-regard. Those who struggle most tend to be the ones for whom the company was everything — no healthy relationships, no hobbies, no sense of meaning outside the exit. \"That's where you tie your whole self-worth and your individual sense of well-being to this event,\" Walling says. No amount of money is \"going to be enough to sustain that for you. \" For now, these are problems for the very few and the very rich. But some thinkers believe AI could make the scenario universal. A harder view is that there is no lasting fix. Staying dissatisfied is how our species has survived, why yesterday's luxury reliably becomes tomorrow's basic need. That's the way Rohrssen leans, at least for now.\" There's probably something in the human condition that's hard to root out,\" he says. \"Maybe you're just fighting against gravity.",

        plainText: "No one is falling for Trump's budget-busting 'dividend' check gimmick — 2026/09/14 No one is falling for Trump's budget-busting 'dividend' check gimmick 2026/09/14 No one is falling for Trump's budget-busting 'dividend' check gimmick Socialism will not be stopped with more socialism. President Donald Trump's proposal to pay every adult citizen $5,000 if the GOP holds the House and Senate this fall is a desperate gimmick that betrays a profound lack of seriousness about the looming fiscal crisis. \"If the Republicans win, you win with us, and you get $5,000,\" Trump said Wednesday night at the party's midterm convention in Dallas. He dubbed the payout the \"Trump Dividend\" and said recipients would have to spend the money inside the United States — but offered no details on how, or whether, Congress would even be asked to authorize it. This would cost an estimated $1.2 trillion next year, according to the Committee for a Responsible Federal Budget — roughly $5,000 times some 245 million adult citizens. The money would need to be borrowed on top of the $40 trillion national debt — and paid back with interest. Even the administration can't agree on where the money is supposed to come from. Trump said revenue from tariffs would cover what he branded as a \"dividend,\" telling Fox News's Laura Ingraham that \"we're taking in $21 trillion\" from tariffs. The Treasury's own numbers put net tariff revenue this fiscal year at about $154 billion. Overall tariff and excise collections since the start of last year total just under $500 billion — but more than $100 billion of that has already been refunded after the Supreme Court struck down many of the administration's tariffs, meaning the government refunded more money in some months than it collected. The taxes on imports that remain in effect are expected to generate less than $200 billion this year, a sum already baked into this year's deficit of more than $2 trillion. The president previously said he'd earmark this same pot of tariff revenue to cover nearly $6 trillion in other costs. It cannot pay for everything twice. Flooding the economy with money would only worsen inflation, since it would mean more dollars chasing the same amount of goods. That would raise the prices of basic staples, as Americans experienced following the two rounds of stimulus checks during the pandemic. But don't count on checks in the mail. This is at least the fourth time in this term Trump has promised Americans a payout that failed to arrive. First it was Elon Musk's \"DOGE dividend,\" floated in February 2025 as $5,000 checks funded by savings the U.S. DOGE Service was supposed to identify; Musk left Washington a few months later having found nowhere near that amount, and the idea was quietly shelved. Then, last November, Trump promised $2,000 tariff rebate checks by the middle of 2026 — timing that would have landed the money in voters' pockets just before the midterms. That check never went out either. Now the same election-season logic is back: Trump told Ingraham the $5,000 dividend would wait until after the midterms because Democrats \"can't\" pass it now, even though Republicans currently control both chambers of Congress. (On Thursday, Trump separately announced that nearly a million Americans will receive $500 rebate checks before the election after being overcharged for their Obamacare plans.) Joe Lonsdale, co-founder of Palantir and a Trump donor, tweeted from the convention: \"I am hugely in favor of winning the midterms, and love much about this admin, but am strongly against bread and circus bribes.\" After Trump's speech, Fox News anchor Bret Baier asked Vice President JD Vance to respond to critics describing the checks as bribery that would bankrupt the country. Vance replied that tariffs are creating \"incredible wealth\" and have \"helped us pay down debt.\" That wealth might be real for lobbyists and lawyers who specialize in seeking exemptions for their clients, but they're raising prices for everyone else. Trump's speech underscored why so many Americans who care about fiscal sanity feel politically homeless. As Trump bragged in Texas about the government taking stakes in chipmaker Intel and Venezuelan oil fields, 27-year-old state Rep. David Morales — a Bernie Sanders-endorsed democratic socialist running on rent control — beat incumbent Democratic Mayor Brett Smiley in Providence, Rhode Island's primary. A Quinnipiac poll released the same week found that 59 percent of Democrats now consider themselves supporters of the Democratic Socialists of America, versus 26 percent of voters overall. Pandering politicians routinely promote expensive ideas in the months before elections. Usually they're offering new programs, more subsidies or tax cuts that won't be paid for. The electorate has become habituated to promises of \"free\" buses, \"free\" child care and \"free\" medical coverage, as well as student loan debt cancellation. Trump's checks-for-votes scheme is just more explicit.",

    createApp({
      data(){
        return {
          kw: "",
          articleList: [],
          selectedDate: "",
          calYear: 2026,
          calMonth: 9, // 0=Jan, 9=Oct
          todayStr: (() => {
            const d = new Date(), p = n => String(n).padStart(2, '0')
            return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`
          })(),
          showArticle: false,
          currentArticle: null,
          mode: "clean",
          showVocab: false,
          vocabList: [],
          articleHtml: "",
          speaking: false,
          dictResult: null
        }
      },
      mounted(){
        // 从文章页「← 返回日历」回来时会带 ?d=YYYY-MM-DD，定位回那一天；
        // 没有参数则自动选中最近有文章的日期
        const qd = new URLSearchParams(location.search).get('d')
        const dates = ARTICLES.map(a => a.publishDate).sort().reverse()
        const target = (qd && ARTICLES.some(a => a.publishDate === qd)) ? qd : (dates[0] || '')
        if(target){
          this.selectedDate = target
          this.articleList = ARTICLES.filter(a => a.publishDate === target)
          // 跳转到对应月份
          const [y, m] = target.split('-')
          this.calYear = parseInt(y)
          this.calMonth = parseInt(m) - 1
        }
      },
      computed:{
        calCells(){
          const year = this.calYear
          const month = this.calMonth
          const firstDay = new Date(year, month, 1).getDay() // 0=Sun
          const daysInMonth = new Date(year, month+1, 0).getDate()
          const cells = []
          for(let i=0;i<firstDay;i++) cells.push({day:null,date:null})
          for(let d=1;d<=daysInMonth;d++){
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`
            cells.push({day:d, date:dateStr, hasArticle: ARTICLES.some(a=>a.publishDate===dateStr)})
          }
          return cells
        }
      },
      methods:{
        changeMonth(delta){
          let m = this.calMonth + delta
          let y = this.calYear
          if(m<0){m=11;y--}
          if(m>11){m=0;y++}
          this.calMonth = m
          this.calYear = y
        },
        selectDate(date){
          const list = ARTICLES.filter(a => a.publishDate === date)
          this.selectedDate = date
          // 当天只有一篇且有独立精读页：点日期直接进文章，不再多套一层列表
          if(list.length === 1 && list[0].readingPath){ location.href = list[0].readingPath; return }
          this.articleList = list
        },
        extractSnippet(text, kw){
          const idx = text.toLowerCase().indexOf(kw.toLowerCase())
          if(idx === -1) return ''
          const start = Math.max(0, idx - 50)
          const end = Math.min(text.length, idx + kw.length + 80)
          let snippet = (start > 0 ? '...' : '') + text.substring(start, end) + (end < text.length ? '...' : '')
          // 高亮关键词
          const re = new RegExp('(' + kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi')
          snippet = snippet.replace(re, '<mark style="background:#fef08a;padding:0 2px;">$1</mark>')
          return snippet
        },
        searchTitle(){
          if(!this.kw.trim()){ this.articleList = []; return }
          const k = this.kw.toLowerCase()
          const kw = this.kw.trim()
          this.articleList = ARTICLES.filter(a =>
            a.title.toLowerCase().includes(k) ||
            (a.source||"").toLowerCase().includes(k)
          ).map(a => {
            const s = this.extractSnippet(a.title, kw)
            return {...a, _snippet: s ? '【标题】' + s : ''}
          })
        },
        searchFull(){
          if(!this.kw.trim()){ this.articleList = []; return }
          const k = this.kw.toLowerCase()
          const kw = this.kw.trim()
          this.articleList = ARTICLES.filter(a =>
            a.title.toLowerCase().includes(k) ||
            a.plainText.toLowerCase().includes(k) ||
            (a.source||"").toLowerCase().includes(k)
          ).map(a => {
            const s = this.extractSnippet(a.plainText, kw)
            return {...a, _snippet: s ? s : ''}
          })
        },
        openArticle(art){
          /* 29 日之后的新式文章：点一下直接进文章页本体，不再套弹窗（无「精读页」按钮、无 ✕）。
             返回走浏览器返回键或文章页顶部的「← 返回日历」 */
          if(art && art.readingPath){ location.href = art.readingPath; return }
          this.currentArticle = art
          this.showArticle = true
          this.mode = "clean"
          this.vocabList = art.vocabs || []
          this.loadContent()
        },
        loadContent(){
          if (this.mode === "reading") return;   // 精读页由 iframe 自行加载
          let url;
          if (this.mode === "clean") url = this.currentArticle.cleanPath;
          else if (this.mode === "annotated") url = this.currentArticle.annotatedPath;
          else if (this.mode === "translated") url = this.currentArticle.cleanPath.replace('.clean.html', '.translated.html');
          const cacheKey = 'article_' + this.currentArticle.fileKey + '_' + this.mode;
          
          // 先从缓存读取（快速显示）
          const cached = safeLS.get(cacheKey);
          if (cached) {
            this.articleHtml = cached;
            this.dictResult = null;
          }
          
          // 从网络获取最新内容，更新缓存
          fetch(url).then(r=>r.text()).then(html=>{
            // 翻译版：剥离源文件自带的 <style> 和 <title>（连同内容），避免小字号和多余标题
            if (this.mode === "translated") {
              html = html.replace(/<style[\s\S]*?<\/style>/gi, '');
              html = html.replace(/<title[\s\S]*?<\/title>/gi, '');
              html = html.replace(/<\/?(html|head|body|meta)[^>]*>/gi, '');
            }
            // 原文页：把难词替换成可点击的蓝色超链接
            if (this.mode === "clean" && this.vocabList && this.vocabList.length > 0) {
              // 一次性替换所有单词，避免重复替换
              const words = this.vocabList.map(v => v.word).filter((w, i, arr) => arr.indexOf(w) === i); // 去重
              const regex = new RegExp(`\\b(${words.join('|')})\\b`, 'gi');
              html = html.replace(regex, (match) => {
                const word = match.toLowerCase();
                const v = this.vocabList.find(v => v.word.toLowerCase() === word);
                if (v) {
                  return `<span class="clickable-word" data-word="${v.word}" style="color:#2563eb;text-decoration:underline;cursor:pointer;">${match}</span>`;
                }
                return match;
              });
            }
            // 去掉文章里的header-bar和subtitle（灰色元信息），保留 h1 英语标题
            html = html.replace(/<div class='header-bar'>[\s\S]*?<\/div>/, "");
            html = html.replace(/<div class="header-bar">[\s\S]*?<\/div>/, "");
            html = html.replace(/<div class='subtitle'>[\s\S]*?<\/div>/, "");
            html = html.replace(/<div class="subtitle">[\s\S]*?<\/div>/, "");
            // 修复词粘连：标签边界处两个字母直接相连（中间无空格）时补空格
            html = html.replace(/([a-zA-Z])<\/[^>]*><[^>]*>([a-zA-Z])/g, '$1 $2');
            this.articleHtml = html;
            this.dictResult = null;
            // 存到缓存
            safeLS.set(cacheKey, html);
            // 搜索后自动滚动到关键词
            if(this.kw.trim()){
              setTimeout(()=>{
                this.scrollToKeyword(this.kw.trim())
              }, 300)
            }
          }).catch(()=>{
            // 网络失败时，如果没有缓存，显示错误
            if (!cached) {
              this.articleHtml = "<p style='color:#999'>文章加载失败，请检查网络。</p>";
            }
          })
        },
      clearCache(){
          const keys = safeLS.keys().filter(k => k.startsWith('article_'));
          keys.forEach(k => safeLS.remove(k));
          alert('已清除 ' + keys.length + ' 篇文章的离线缓存');
        },
        scrollToKeyword(kw){
          const container = document.querySelector('.modal-card')
          if(!container) return
          // 遍历文本节点找关键词
          const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null)
          const kwLower = kw.toLowerCase()
          let node
          while(node = walker.nextNode()){
            if(node.textContent.toLowerCase().includes(kwLower)){
              // 高亮并滚动
              const range = document.createRange()
              const idx = node.textContent.toLowerCase().indexOf(kwLower)
              range.setStart(node, idx)
              range.setEnd(node, idx + kw.length)
              const mark = document.createElement('mark')
              mark.style.background = '#fef08a'
              mark.style.padding = '2px 0'
              range.surroundContents(mark)
              mark.scrollIntoView({behavior:'smooth', block:'center'})
              break
            }
          }
        },
        closeArticle(){
          this.showArticle = false
          this.currentArticle = null
          this.articleHtml = ""
          this.showVocab = false
        },
        printArticle(){
          /* 精读页模式：直接调用 iframe 内页面的打印（其打印样式只含标题+英文正文） */
          if(this.mode === 'reading'){
            const fr = document.querySelector('.reading-frame');
            if(fr && fr.contentWindow){ fr.contentWindow.focus(); fr.contentWindow.print(); }
            return;
          }
          // 打印固定输出批注版完整页面（自带 A4 打印样式与 utf-8 编码声明，无乱码）
          fetch(this.currentArticle.annotatedPath).then(r=>r.text()).then(html=>{
            const w = window.open('', '_blank');
            if (!w) { alert('弹窗被浏览器拦截，请允许弹窗后重试'); return; }
            w.document.write(html);
            w.document.close();
            w.print();
          }).catch(()=>alert('打印失败，请检查网络'));
        },
        downloadArticle(){
          // 下载固定输出批注版完整页面（原文件含 <meta charset='utf-8'>，本地打开不乱码）
          fetch(this.currentArticle.annotatedPath).then(r=>r.text()).then(html=>{
            const blob = new Blob([html], {type: 'text/html;charset=utf-8'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = this.currentArticle.fileKey + '.annotated.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          }).catch(()=>alert('下载失败，请检查网络'));
        },
        toggleSpeak(){
          if (this.speaking) {
            speechSynthesis.cancel();
            this.speaking = false;
            return;
          }
          const div = document.createElement('div');
          div.innerHTML = this.articleHtml;
          const text = div.textContent || div.innerText || '';
          if (!text.trim()) return;
          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = 'en-US';
          utter.rate = 0.9;
          utter.onend = () => { this.speaking = false; };
          utter.onerror = () => { this.speaking = false; };
          speechSynthesis.cancel();
          speechSynthesis.speak(utter);
          this.speaking = true;
        },
        handleWordClick(e){
          const word = e.target.getAttribute('data-word');
          if (!word) return;
          const v = this.vocabList.find(v => v.word.toLowerCase() === word.toLowerCase());
          if (v) {
            this.dictResult = v;
          }
        },
        printVocab(){
          const rows = this.vocabList.map(v => '<tr><td>'+v.word+'</td><td>'+v.phonetic+'</td><td>'+v.definition+'</td></tr>').join('')
          const w = window.open('', '_blank')
          w.document.write('<html><head><meta charset="utf-8"><title>生词表</title><style>body{font-family:sans-serif;padding:2rem}table{width:100%;border-collapse:collapse}td{padding:6px;border-bottom:1px solid #ddd}</style></head><body><h2>'+this.currentArticle.title+' — 生词表</h2><table><tr><th>单词</th><th>音标</th><th>释义</th></tr>'+rows+'</table></body></html>')
          w.document.close()
          w.print()
        }
      }
    }).mount('#app')
  </script>
</body>
</html>
