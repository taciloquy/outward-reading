</script>
  <style>
    :root{
      --paper:#f6f2ea; --card:#fffdf8; --ink:#2b2822; --muted:#8a8272;
      --accent:#2f4858; --accent-soft:#e9e2d3; --gold:#a8843c; --line:#e4dccb;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    [v-cloak] { display: none; }
    body{font-family:system-ui,-apple-system,sans-serif;max-width:1100px;margin:0 auto;padding:1rem 1rem 3rem;line-height:1.6;background:var(--paper);color:var(--ink);
      background-image:linear-gradient(180deg,#f8f5ef 0%,#f6f2ea 240px);}
    h2{color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:1.6rem;font-weight:700;letter-spacing:.02em;margin:1.2rem 0 .6rem;padding-bottom:.55rem;border-bottom:1px solid var(--line);position:relative;text-align:center;}
    h2::after{content:'';position:absolute;left:50%;transform:translateX(-50%);bottom:-1px;width:3.2em;height:2px;background:var(--gold);}
    .search-bar{margin:1rem auto;display:flex;flex-direction:column;gap:8px;max-width:600px;}
    .search-bar input{padding:10px 14px;width:100%;font-size:1rem;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);outline:none;transition:border-color .2s;}
    .search-bar input:focus{border-color:var(--accent);}
    .search-btns{display:flex;gap:8px;justify-content:flex-end;}
    .search-btns button{padding:8px 16px;cursor:pointer;background:var(--accent);color:#f7f4ec;border:none;border-radius:8px;font-size:0.9rem;white-space:nowrap;transition:opacity .2s;}
    .search-btns button:hover{opacity:.88;}

    /* ===== 日历插件 ===== */
    .calendar-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem;margin:1rem auto;max-width:600px;box-shadow:0 1px 4px rgba(90,75,45,.06);}
    .cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.8rem;}
    .cal-header button{padding:4px 10px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;font-size:0.85rem;}
    .cal-header .cal-title{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:1rem;font-weight:600;}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:38px;gap:4px;}
    .cal-dow{text-align:center;font-size:0.7rem;color:var(--muted);padding:2px 0;font-weight:600;}
    .cal-day{height:38px;display:flex;align-items:center;justify-content:center;border-radius:6px;cursor:pointer;font-size:0.85rem;border:1px solid transparent;transition:all .15s;position:relative;color:var(--ink);}
    .cal-day:hover{background:var(--accent-soft);}
    .cal-day.empty{cursor:default;visibility:hidden;height:32px;}
    .cal-day.empty:hover{background:transparent;}
    .cal-day.has-article{background:var(--accent-soft);color:#6b5326;font-weight:600;}
    .cal-day.has-article::after{content:'';position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--gold);}
    .cal-day.selected{background:var(--accent);color:#f7f4ec !important;}
    .cal-day.selected::after{background:#f7f4ec;}
    .cal-day.today{border-color:var(--gold);}

    .article-list{margin:1rem auto;max-width:600px;}
    .article-item{padding:14px;border:1px solid var(--line);border-radius:8px;margin:8px 0;cursor:pointer;background:var(--card);transition:all .2s;}
    .article-item:hover{border-color:var(--accent);box-shadow:0 3px 10px rgba(70,58,30,.09);transform:translateY(-1px);}
    .article-item .title{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:1.02rem;font-weight:600;color:var(--ink);line-height:1.45;}
    .article-item .date{font-size:0.85rem;color:var(--muted);margin-top:4px;}
    .article-content{margin:1rem 0;line-height:1.75;font-size:1.05rem;}
    /* ===== 原文页上下分屏 ===== */
    .split-view{display:flex;flex-direction:column;height:75vh;margin:1rem 0;}
    .article-reading{flex:1;overflow-y:auto;padding:10px;border-bottom:2px solid var(--line);line-height:1.75;font-size:1.05rem;}
    .dict-panel{height:180px;overflow-y:auto;padding:10px;background:#f3efe4;border-radius:4px;}
    .dict-placeholder{color:var(--muted);text-align:center;padding:40px 0;}
    /* 翻译版视图：字体/行高/字号与原文视图一致，全屏阅读不分屏 */
    .translated-view{font-size:1.05rem !important;line-height:1.75 !important;font-family:system-ui,-apple-system,sans-serif !important;overflow-y:auto;padding:10px;}
    /* 移动端适配 */
    @media (max-width: 600px) {
      .split-view{height:70vh;}
      .article-reading{font-size:18px;}
      .dict-panel{height:150px;}
    }
    .article-content p{font-family:Georgia,"Songti SC","Noto Serif SC",serif !important;font-size:18px !important;line-height:1.95 !important;margin:0 0 8px 0 !important;color:#33302a !important;letter-spacing:normal !important;}
    .article-content pre{white-space:pre-wrap !important;line-height:1.4 !important;margin:0 0 2px 0 !important;padding:0 !important;}
    .article-content h1{font-family:Georgia,"Songti SC",serif !important;font-size:18px !important;margin-bottom:6px !important;}
    .article-content .subtitle{font-size:12px !important;color:#6d6555 !important;margin-bottom:12px !important;}
    .article-content .header-bar{font-size:11px !important;}
    .btn-group button{margin-right:8px;padding:8px 14px;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:0.9rem;transition:all .2s;}
    .btn-group button:hover{border-color:var(--accent);}
    .btn-group button.primary{background:var(--accent);color:#f7f4ec;border-color:var(--accent);}
    .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(43,40,34,.45);z-index:10;display:flex;align-items:center;justify-content:center;}
    .modal-card{background:var(--card);width:100%;max-width:100%;height:100%;border-radius:0;padding:0 1.5rem 1.5rem;overflow:auto;box-shadow:0 10px 40px rgba(50,40,20,.18);}
    .reading-view{height:calc(100vh - 66px);}
    .reading-frame{width:100%;height:100%;border:1px solid var(--line);border-radius:10px;background:#fff;}
    .modal-card h3{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;margin-bottom:1rem;font-size:1.2rem;}
    .vocab-item{padding:8px 0;border-bottom:1px solid var(--line);}
    .vocab-item strong{color:var(--ink);}
    .vocab-item .phonetic{color:#4a6b8a;margin:0 6px;}
    .vocab-item .def{color:#6d6555;}
    .empty{color:var(--muted);padding:2rem 0;text-align:center;}
    .close-btn{float:right;cursor:pointer;font-size:1.5rem;color:var(--muted);padding:4px 12px;background:#f0ead9;border-radius:8px;}

    /* ===== 手机适配 ===== */
    @media (max-width: 600px) {
      body{padding:0.5rem 0.8rem 2rem;}
      h2{font-size:1.3rem;}
      .search-bar input{font-size:16px;} /* 防止iOS自动放大 */
      .calendar-box{max-width:100%;padding:0.8rem;}
      .cal-day{height:36px;font-size:0.85rem;}
      .modal-card{width:100%;height:100%;border-radius:0;padding:1rem;}
      .btn-group button{padding:10px 14px;font-size:16px;} /* 触控友好 */
      .article-item{padding:12px;}
      .reading-view{height:calc(100vh - 84px);}
      .article-content pre{font-size:20px !important;line-height:1.8 !important;}
      .vocab-item{font-size:15px;}
    }
  </style>
</head>
<body>
  <div id="app" v-cloak>
    <h2>📚 共享外刊精读库</h2>

    <div class="search-bar">
      <div style="position:relative;">
        <input v-model="kw" placeholder="输入关键词" @keyup.enter="searchFull" style="padding-right:28px;">
        <span v-if="kw" @click="kw='';articleList=[]" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);cursor:pointer;color:#999;font-size:16px;">✕</span>
      </div>
      <div class="search-btns">
        <button @click="searchTitle()">搜标题</button>
        <button @click="searchFull()">搜全文</button>
      </div>
    </div>

    <!-- ===== 日历插件 ===== -->
    <div class="calendar-box">
      <div class="cal-header">
        <button @click="changeMonth(-1)">‹</button>
        <span class="cal-title">{{ calYear }}年{{ calMonth+1 }}月</span>
        <button @click="changeMonth(1)">›</button>
        <button @click="clearCache()" title="清除离线缓存" style="margin-left:auto;font-size:1rem;padding:4px 8px;">🗑</button>
      </div>
      <div class="cal-grid">
        <div class="cal-dow" v-for="d in ['日','一','二','三','四','五','六']" :key="d">{{d}}</div>
        <div v-for="(cell,i) in calCells" :key="i"
          class="cal-day"
          :class="{empty:!cell.day, selected:selectedDate===cell.date, 'has-article':cell.hasArticle, today:cell.date===todayStr}"
          @click="cell.day && selectDate(cell.date)">
          {{ cell.day || '' }}
        </div>
      </div>
    </div>

    <div class="article-list" v-if="articleList.length>0">
      <div class="article-item" v-for="art in articleList" :key="art.fileKey" @click="openArticle(art)">
        <div class="title">{{ art.title }}</div>
        <div class="date">{{ art.publishDate }}</div>
        <div v-if="art._snippet" style="font-size:0.85rem;color:#666;margin-top:6px;line-height:1.5;" v-html="art._snippet"></div>
      </div>
    </div>

        plainText: "The Americans changing politics for the better — 2026/10/31 The Americans changing politics for the better Midterm elections are always a referendum on the sitting American president, but rarely has an incumbent so wilfully put himself in the spotlight in defiance of his own unpopularity. As the campaign ends, Donald Trump is commandeering rallies in Republican strongholds, a sign of his party’s vulnerability and his unwavering faith in his own star power. Away from the spotlight, however, something more surprising—and more important—has been happening: Hispanics and Asians have emerged as America’s most valuable voters. The curse of American politics is its bitter partisanship. As voters have sorted themselves along racial, educational and geographical lines, the parties have spent less time trying to win converts from the other side and more whipping their own supporters into a permanent frenzy: 70% of Republicans are hostile towards Democrats and more than 80% of Democrats return the favour. The result is a style of politics that tugs public life towards the extremes, punishes compromise and puts getting people angry above getting things done. Hispanic and Asian-American voters offer the best hope of arresting this baleful trend. They have become America’s crucial swing voters, with an outsize impact on races across the country. Compared with other blocs, their numbers are growing faster, their ideology is more fluid and their priorities are less divisive. That means they are likely to be good for America not just in these midterms, but also for many elections to come. No group captures the potential for opening up politics as much as Hispanics and Asian-Americans. One reason is demography. They are a growing fraction of the population—especially Hispanics, who are three times more numerous than Asian-Americans. Since 2006 their combined share of the electorate has increased by nine percentage points, to reach 21%. They are also highly diverse. The grandchildren of an immigrant from Ho Chi Minh City have a different outlook from a new arrival from Bangalore. Neither fits neatly into the familiar Democrat-Republican template. And they are more likely to switch their votes. In 2012 Democrats thought they had a lock on Latinos and Asians. In 2024 the story was how they were becoming Trumpian. It has now become clear that they were swing voters all along. White voters changed little between 2020 and 2024, while both Latinos and Asians lurched hard to the right. They were then the fastest to turn against Mr Trump in early 2025. The margin of support for Democrats has risen by 17 points among Latinos and 14 among Asians since 2024, compared with ten for whites and five for black voters. Part of the explanation for this is that these voters are the epitome of striving Americans who want to work hard and get ahead. Higher prices for food and fuel hit Hispanic voters particularly hard; housing costs affected Asian voters. Latinos are more than twice as likely to start businesses as white voters. Asians are likely to spend more time in education. Many are recent arrivals or the children of immigrants, so their opinions have not yet hardened along party lines. In contrast to the rest of the voting population, if Hispanics and Asians hold one left-leaning position, they will not necessarily endorse others. Likewise, wanting a secure southern border does not equate to support for the hardline enforcement that has frightened Hispanic employees into staying away from work. Instead, many are moderate. They have little truck with culture wars or polarisation. The economic policies they care about diverge from the tribal messages the parties use to stir up their bases. Whereas policies on abortion and trans rights are set at the extremes, economic management is suited to the swing voter’s pragmatic preference for the common good. Almost anything that gives the parties a reason to appeal to the centre will benefit America,  the Philippines who now live in Dubai, were on the Iryo train, and Fredrich was sent flying by the impact. \"One guy was shouting: 'Get out! Get out! Another train could hit!'\" said Fredrich. \"We saw all the people were also getting off. Many of them had head injuries and were covered in blood. We just got as far away from the train as we could.\" \"It all happened in a split second,\" said Arabella. \"The table we were sitting at just disappeared in the crash. I feel like we're on our second life.\" Spain's transport minister, Óscar Puente, said that rear-end collisions like that which had taken place on Wednesday were \"highly unlikely\" and suggested that the accident may have been caused by human error made in \"inexplicable\" circumstances. He said the LZB signalling system, which automatically halts a train if the line ahead is occupied, had gone down at about 8.30am local time due to a computer malfunction. As a result, an estimated six trains had been halted along a stretch of around 63km of track, he said. The task of monitoring the rail lines then fell to a 24-hour command centre in Madrid. Minutes after the computer malfunction, the centre instructed at least two of the trains to continue as normal, despite the fact that there was still a \"stop signal\" in place, said Puente. \"It was the control centre, through its operators, that made the decision to resume traffic, under circumstances that, from our point of view, are inexplicable,\" he said. \"Clearly, it was a wrong decision.\" Giving initial details about the crash, Puente said the Iryo train had been travelling ahead on the tracks and had been sitting stationary when the Renfe train was instructed by the command centre to resume its journey. The Renfe train then travelled approximately 25km before colliding with the Iryo train about 17 minutes later. The control centre \"had more than enough time to verify the error, and they did not fix it\", Puente added. Puente said that similar erroneous instructions had been given to at least one other train on Wednesday morning. \"And it was the engineer of one of the trains who corrected the command centre and told them he can't resume normal operation – it has to be [an] on-sight operation,\" Puente said. The tragedy was the second major deadly high-speed train accident this year in Spain, rattling a country where the extensive rail network has long been a point of pride. In January, 46 people were killed and dozens more injured after two trains – again, one from Renfe and one from Iryo – collided on the same line near the town of Adamuz in Andalucía. But, as also happened at Adamuz, the solidarity and kindness on display is likely to turn to anger over the coming hours as people seek answers as to how one of Europe's most modern and extensive high-speed rail networks could experience two deadly collisions that have between them claimed at least 114 lives in the space of just 10 months. The opposition People's party leader, Alberto Núñez Feijóo, called for an immediate investigation into what had happened, as well as a \"complete and independent review\" of Spain's entire rail network. \"Spain has the right to know what is going on with its infrastructure,\" he told reporters.",

        plainText: "Don't expect supersize profits from Anthropic soon — 2026/10/29 Don't expect supersize profits from Anthropic soon Breakneck growth is commonplace in Silicon Valley. The rise of Anthropic is something else. In the first quarter of last year—when Claude Code, its hit programming tool, was first released—the artificial-intelligence lab pulled in $376m of revenue. By the second quarter of this year that figure had risen 30-fold, to $11.6bn, exceeding corporate mainstays such as McDonald's. In a few weeks this darling of the AI revolution will undergo an initial public offering (IPO) that will be, if not the largest of all time, then certainly close to it. On October 26th it publicly filed supporting paperwork that gave the outside world a closer look at its finances. Anthropic's growth is all the more remarkable because, unlike many zippy startups, it has already reached profitability. In the second quarter it eked out an operating profit of just under $1bn, having lost $1.7bn in the preceding three months. The company is particularly eager to draw attention to its spending on computing power, which fell from 251% of sales in the first quarter of 2025 to just 48% in the second quarter of 2026. Anthropic claims that improvements in its AI models have made it faster and more efficient to develop and serve its technology, allowing the company to make the most of its limited resources. But can Anthropic's stunning performance continue? A closer look at its filing suggests caution is warranted: growth is slowing; the company is paying higher prices to access scarce computing power; and a resulting shift towards directly purchasing AI chips will guzzle up much of the cashflow Anthropic would otherwise be on course to generate. Earlier investors who had hoped for a public valuation as high as $2trn may thus be disappointed. Anthropic's scorching revenue growth has put a target on its back. Claude Code made it an early leader in the race to automate programming. Tech giants such as Meta and Microsoft became huge customers, spending billions of dollars on Anthropic's technology. More recently those customers have been pushing staff to use internally developed alternatives. At the same time, OpenAI, Anthropic's arch-rival, has been gaining ground with its own offering, Codex, the daily usage of which has risen ten fold since early August. And after the short-lived craze for \"tokenmaxxing\" earlier this year, companies of all stripes have been more closely monitoring their spending on AI and imposing limits on their engineers. This month Anthropic told shareholders during a private gathering that revenue in the third quarter was up by about 45% from the preceding three months, a third of the rate it achieved in the second quarter. In its IPO prospectus Anthropic warns that, as the market matures, growth could slow \"more rapidly than we anticipate\". Moreover, it has become increasingly reliant on the tech giants to push its products. Almost half of Anthropic's revenue in the first six months of this year came from sales made through the cloud businesses of Alphabet, Amazon and Microsoft. Anthropic's spending on sales, marketing and distribution partnerships such as these chewed up 19% of revenue in the first half of 2026, up from 10% in the same period a year before. Another problem Anthropic faces is that, like other AI developers, it is struggling to secure the computing power it needs. In its prospectus it warns investors that its use of \"short-term compute\" could go up in the near term, weighing on margins. For example, Anthropic has agreed to pay SpaceX about $3.1bn per month to use its Nvidia chips into 2029. (Anthropic is able to back out from early next year with 90 days' notice.) That explains why Anthropic is starting to develop more of its own computing infrastructure, rather than relying solely on cloud providers. This strategy should help keep operating costs under control, but also provides forewarning         readingPath: "/outward-reading/articles/2026/10/2026-10-28_001.reading.html",
        source: "The Economist",

        annotatedPath: "/outward-reading/articles/2026/10/2026-10-28_001.annotated.html",
        plainText: "The Great Louvre Robbery Was Just the Start. It's Been the Year of the Heist. — 2026/10/28 The Great Louvre Robbery Was Just the Start. It's Been the Year of the Heist. In the year since thieves stunned the world by smashing their way into the Louvre Museum and stealing France's crown jewels worth at least $101 million, art heists have only intensified. From Wales to Sicily, more than 14 museums have been hit by smash-and-grab criminals since early 2025, suggesting museums haven't cracked the code on how to safely protect their treasures. Police are still looking for the Louvre's stolen trove of 19th-century jewelry. Experts have myriad theories about why art heists are increasing, from soaring gold prices making golden antiquities and precious gems more valuable to the misguided notion that stolen art can reap higher sums on the black market—it cannot. But museum directors and security firms agree the Louvre breach set an ominous precedent. \"Louvre was a wake-up call that anywhere can be hit,\" said Chris Marinello, chief executive of Art Recovery International. For its part, the Louvre created a new security coordinator position now held by Olivier Goupil, a veteran police officer. The museum also added more crowd-control barriers and anti-ram devices around its exterior. There are now window railings at the upper-level Apollo Gallery where thieves broke in. In a statement, the museum said the challenge is to balance its mission of protecting its collection while also sharing it with roughly 30,000 visitors a day. \"Museums are not fortresses,\" the museum said in an email. The Louvre heist revealed that thieves are increasingly stealing gold, bronze and jewels more than traditional paintings—a turnaround from a century ago when a thief stole its \"Mona Lisa,\" later recovered. In 10 of the subsequent museum break-ins across Europe over the past year, thieves bypassed paintings to steal objects that could be dismantled or melt down, because such commodities retain value as precious metals and gems. Black-market jewelers are often willing to re-cut and reshape bigger jewels into smaller untraceable ones that can be resold anywhere, investigators say. On Oct. 5, thieves broke into the C. Karoutzos Contemporary Art Center in central France and hauled off a 330-pound bronze book cover decorated with gold, gems and shells designed by surrealist Salvador Dalí. Museum owner Christian Karoutzos said his video cameras captured a few shadowy figures leaving the scene, but the book cover remains missing. On the other hand, authorities have had better success recovering stolen paintings. It likely helped that the works were identifiable and only valuable if left intact, Marinello said. \"You can't melt down a Renoir.\" In 1990, two men disguised as police officers spent 81 minutes crisscrossing Boston's Isabella Stewart Gardner Museum to cut out and carry off masterpieces by Vermeer and Rembrandt. This year's heist at the Magnani Rocca took less than three minutes. Geoff Kelly, a former FBI agent, said thieves are breaking in, grabbing what they can and fleeing the scene within minutes—before the police arrive. In July, Paris's Museum of Natural History suffered an undetected cyberattack that disabled its alarm and surveillance systems, police said. Two months later, robbers monitoring the digital breakdown were able to saw through an emergency exit door and use blowtorches and other weapons to steal about 13 pounds of gold worth around $2 million. An earlier audit of the museum's security protocols found that the Louvre's video surveillance and physical security systems relied on a weak password, \"LOUVRE.\" It was immediately changed, the museum said. Marinello said thieves are beginning to use artificial intelligence to identify museums with hefty holdings of gold or those housed in smaller, historic buildings that might be easier to breach. It's \"something that should scare the bejesus out of museum directors,\" he said. As an experiment, Marinello asked an AI tool to help him steal a painting; the tool refused to participate in a possible crime but still assisted him in locating rope and sledgehammers and other gear from the nearest hardware stores. The flip side: Museums say they're using AI-assisted video surveillance to help guards scour for bad actors by analyzing people's behavior as they move through the galleries rather than recording footage passively. Victimized museums are often compelled to cope by closing indefinitely or reopening with fewer treasures on view. The Louvre has reopened its Apollo Gallery, but all the remaining jewelry in it has been removed, resulting in an empty, ceremonial 17th-century gallery. At the Louvre, staff are still discussing when and how to put the theft's lone survivor back on public view: Empress Eugenie's 19th-century crown, which thieves dropped and crumpled outside the museum during their getaway. Conservators say one of its eight golden eagles is missing and so are 10 of its 1,354 diamonds, but its 56 emeralds and central globe survived. \"It will be exhibited at the Louvre when we have found the ideal location to create a dedicated, secure exhibition space,\" the museum said, \"but for now, not all conditions are in place.\"",

{
        title: "How a Trillion-Dollar Industry Launders Illegal Gold",
        publishDate: "2026-10-27",

        source: "The Economist",
        cleanPath: "/outward-reading/articles/2026/10/2026-10-27_001.clean.html",
        annotatedPath: "/outward-reading/articles/2026/10/2026-10-27_001.annotated.html",
        plainText: "How a Trillion-Dollar Industry Launders Illegal Gold — 2026/10/27 How a Trillion-Dollar Industry Launders Illegal Gold In an industry riddled with abuse, the world's banks and governments rely on one entity to keep gangsters, warlords and human rights violators from selling gold into the mainstream market. That group, the London Bullion Market Association, is the self-described \"global authority for precious metals.\" But a New York Times investigation found that the association has repeatedly allowed gold into the market that has been mined by criminals, cartel members and children. Refiners lie with impunity about the origins of their gold. And in the case of Madagascar, the L.B.M.A. helped change and backdate key paperwork that certified gold as free from abuse. The Times investigation shows that the divide between \"clean\" and \"dirty\" gold is an industry fiction. There is just gold. And as Wall Street, central banks and investors stockpile and trade the precious metal, they're profiting off a supply that includes gold from illegal sources. The price this year crossed the $5,000 mark. That has made it profitable to mine in inefficient, destructive and politically destabilizing ways. The industry works like this: Miners and brokers sell raw gold to refiners, which melt it, remove impurities, and form it into bars. The major international marketplace accepts bars only from the 67 L.B.M.A.-certified refineries. Those refiners must document the source of every ounce of gold in every bar. But for all its talk about being a global authority, the L.B.M.A. is mostly a paperwork collector. The association relies on refiners to inspect the mines and to self-report the details. Madagascar's central bank decided to capitalize on booming prices by buying and stockpiling gold, including from illegal mines that employ children. To see how it happened, I began at the mines themselves. I took a propeller plane from the capital, Antananarivo, and drove three hours through farmland to a mine called Madagold. The mine sits in a dry valley in the northern part of the island, surrounded by a busy market fueled by gold-rush cash. Everywhere I looked, at Madagold and at mines across the country, children were in danger. Children in Madagascar's mines crushed rocks and hauled buckets of ore. Toddlers wandered between 100-foot-deep shafts. In the gold-rich northern region of Diana, miners follow no laws, the government's regional mining supervisor, Firmin Razafindratondra, said. All of the area's gold mining, he said, is illegal. Outside Mananjary, on Madagascar's east coast, miners operated despite government shutdown orders. Excavators turned rice paddies into a giant pit. For that gold to be worth anything, it needed to be \"certified L.B.M.A.,\" Madagascar's central bank governor, Aivo Andrianarivelo, said. So he dispatched his gold chief to Switzerland to find a refiner. Refiners questioned the gold's origins and legality. \"Nobody wanted to touch this gold,\" said Marc Ummel, a gold-supply-chain specialist at the nonprofit group SwissAid. Small-scale mines are considered red flags. The L.B.M.A.'s rules say that any refiner accepting this gold would be required to conduct mine inspections. \"It's impossible,\" Mr. Ummel remembers telling Madagascar's banker. \"You will never be able to find an L.B.M.A. refiner.\" On that point, he was wrong. The central bank cut a deal in 2023 with the Istanbul Gold Refinery, one of the world's biggest L.B.M.A.-certified refiners. The Turkish refiner's auditor filed paperwork with the L.B.M.A. claiming that it \"does not do any business\" with mines that raise red flags. That claim freed the company from having to conduct inspections. The raw gold was melted into 12 kg bars at a plant next to Madagascar's international airport. From there, tens of millions of dollars in gold was shipped to Turkey to enter the legitimate supply. It was only by chance that anyone at the L.B.M.A. took a look at the Madagascar gold. The European Union happened to be considering certifying the association for a new oversight role. An E.U. inspector noticed the Madagascar deal and began scrutinizing it. How, the inspector asked, could a refinery process gold from Madagascar yet claim no red flags? L.B.M.A. staff escalated the problem to a \"compliance panel\" that included the chief executive, Ms. Crowell. The association could have punished the refiner. Instead, the L.B.M.A. helped cover up the problem. Association officials worked with the Istanbul Gold Refinery's auditor to create a new report that made it seem like the refiner had disclosed the red flags from the beginning and had taken steps to scrutinize the supply chain. The report was backdated, as if it had been filed in real time. That backdated report remains on the L.B.M.A.'s website, with no indication of any alterations. The matter was closed. The gold was certified as meeting the world's most rigorous standards. Now those same refiners who had turned Madagascar away are calling looking to buy gold, Mr. Andrianarivelo said, because the L.B.M.A. had declared that \"there was no issue\" with it.",

{
        title: "US has for years asked Musk to alter Starlink service in Ukraine, Middle East, sources say",

        plainText: "US has for years asked Musk to alter Starlink service in Ukraine, Middle East, sources say — 2026/10/26 US has for years asked Musk to alter Starlink service in Ukraine, Middle East, sources say Well before the throttling this month of Ukraine's military access to Elon Musk's satellite communications system, the Biden and Trump administrations had several times asked SpaceX to turn its Starlink service on or off in various countries, according to six former senior US officials familiar with the matter. During the presidency of Joe Biden, the requests included switching off the service to prevent Iranian proxy militias in Yemen and Lebanon from using Starlink to communicate, and activating the service to provide internet access inside Iran and in Ukraine to support its military. Similarly, President Donald Trump's administration asked Musk, who is CEO of SpaceX, to make the service available in Iran following US-Israeli strikes in 2025 and 2026, in hopes it would bolster internet access and communications for anti government protesters. The recent blowup over restrictions to Ukraine's use of SpaceX satellite services has raised questions about the ties between the US government and Musk, whose company owns systems vital to the US military and to US allies. The Biden-era and Trump requests to Musk show a close relationship in which US administrations rely on an unprecedented degree of a private-sector company to help implement policy. The recent limits on Ukraine, despite being a US ally, have also rattled officials in Europe, some of whom argue that Europe must develop its own military satellite communications capabilities because no viable short-term alternative currently exists. Ukrainian President Volodymyr Zelensky said last week that his country's access to Starshield, the military version of the Starlink system, had been intentionally limited, interfering with the performance of the country's military drones. He also said the speeds were reduced for Starlink, which Ukraine uses for some military activities including defense against Russian missile attacks. The White House, contacted for comment, referred Reuters to Trump's remarks on Friday, when he said he had not spoken with Musk about Starlink access issues for Ukraine and that \"if there is a problem, I'll get it straightened out.\" SpaceX did not respond to requests for comment, although Musk said in a social media post earlier this week: \"Starshield systems are owned and controlled by the US government. Any limits on speed or usage are decided by the US military and ultimately (by the president of the United States).\" For Ukraine, the Starlink internet service has become the lifeblood of frontline communication between units, who say there is currently no rival to the capabilities of SpaceX's products. Starshield receivers, largely impervious to radio jamming, are used as onboard guidance systems and to provide links to a remote pilot for Ukrainian drones, including deep behind Russian lines inside Ukraine. Musk's role as the strong-willed CEO of a company with outsized influence over US national security has at times raised questions over who is making decisions about SpaceX's satellite services. The Biden administration at times relied on Musk to help implement policy. Biden officials coordinated with SpaceX to thwart US adversaries by cutting the service, and to help allies by expanding Starlink's availability. They added that discussions between the government and SpaceX often focused on preventing groups such as the Iranian-linked Houthis in Yemen and Hezbollah in Lebanon from using Starlink terminals. In October 2023, during fighting between Israel and Hezbollah militants in southern Lebanon, intelligence officials told the White House that individuals linked to Hezbollah could have gained access to Starlink terminals. Officials had similar concerns about the Houthis in Yemen in 2024 during a US air campaign against the Iran-linked group. In both cases, the administration contacted SpaceX and asked it to identify the terminals and shut them off. At least some of the terminals were deactivated. In a 2024 submission to the US Commerce Department's Bureau of Industry and Security, SpaceX said it works closely with US government agencies to secure export authorizations where required and to safeguard technology in support of US national security objectives and foreign policy goals. Soon after Russia's full-scale invasion of Ukraine in 2022, Biden officials pushed SpaceX to expand Starlink use for the Ukrainian military. In a separate instance, the Biden administration asked SpaceX to turn on Starlink in Iran during a protest movement launched in September 2022 after the death of Mahsa Amini, an Iranian arrested for not wearing her hijab properly. Starlink terminals were moved into the country with the help of the administration. The Trump administration took a similar step earlier this year and discussed with Musk and SpaceX getting Starlink terminals into Iran and activated following US-Israeli strikes in the country in June 2025 and again in February 2026. Neither the Trump administration nor SpaceX has publicly confirmed that those terminals were turned on. The Wall Street Journal reported in February that the US government had sent thousands of Starlink terminals into Iran.",

        annotatedPath: "/outward-reading/articles/2026/10/2026-10-25_001.annotated.html",
        plainText: "China has captured the market for hobbyist 3D printers — 2026/10/25 China has captured the market for hobbyist 3D printers The fastest-growing industrial product in China today is not the electric vehicle, lithium-ion battery or even humanoid robot. It is the humble 3D printer for hobbyists. Once geeky curios, 3D printers have quietly become one of China's most successful consumer electronics. Exports of the machines grew by 90% in the first half of this year. In the past decade China's global market share has risen from 19% to 96%, ending the dominance of Western firms. The personal 3D-printing market is now split among the \"four little dragons of Shenzhen\", says Chris Connery of Context, a London-based market-intelligence firm. Creality, Anycubic, Elegoo and the industry's leader, Bambu Lab, reign supreme globally (see chart). Their success shows, yet again, how fierce competition in China combined with generous government support can help improve quality and drive down export prices, making Chinese products hard to beat. The printers work by building objects layer by layer, usually by extruding molten plastic. Invented by Chuck Hull, an American, in 1983, they long remained expensive, unreliable and difficult to use. Today they routinely sell for a little more than $500 and have the sleek aluminium finish of an Apple computer. Comparable entry-level printers from Western firms start at more than double the price. Artificial intelligence allows users to create print designs for such things as tools, parts or toys by describing them in natural language rather than using complicated design-software. Just as Chinese factories helped to turn drones into recreational devices (as well as game-changers in warfare) by achieving large-scale production at low cost, so they are now doing with 3D printers. For most of its history, consumer 3D printing had an unspoken cost of entry: patience. Getting a printer to actually work often took longer than using it. Bed leveling, calibration, and trial and error troubleshooting weren't occasional annoyances; they were simply part of owning one. That was the deal, and for years, nobody in the industry seriously challenged it. Part of Bambu Lab's different approach can be traced back to its founding team. Several of its engineers came from DJI, the drone manufacturer, with backgrounds in robotics and consumer electronics. Drones present a similar design challenge to 3D printers: they're mechanically complex, but successful consumer products need to be usable without specialized training. Bambu Lab's founders had already worked through that kind of problem before applying it to printing. The company also didn't rush its first product. It spent 22 months on research and development before releasing its first printer, the X1, which launched on Kickstarter and raised about HK$55 million, or roughly $7 million, from 5,575 backers. The core of Bambu Lab's approach is automating steps that previously required manual adjustment. Its printers include cameras, LiDAR, and gravity sensors that handle bed leveling and calibration automatically on every print, without requiring the user to understand the underlying mechanics. LatePost described the result as \"a small AI-enabled robot.\" One Bambu Lab owner on Reddit summarized the difference simply: \"Bambu printers just work.\" Price wars have eaten into the printer dragons' profits even as sales boom. But the firms still excite investors. Bambu Lab was founded in 2020 by alumni of another Chinese company, DJI, the world's leading dronemaker. The printer-maker is reported to have a private valuation of about $10bn. Last year DJI itself invested in Elegoo, a Bambu rival. Creality listed on the Hong Kong Stock Exchange in May. It boasts a market capitalisation of HK$12bn ($1.5bn). The government cherishes 3D-printing firms. The business featured in its \"Made in China 2025\" industrial plan, which was launched in 2015 to ensure domestic strength and self-reliance in high-tech manufacturing (much to the West's concern). Officials see 3D printers as a way to produce components of aerospace, health care and military equipment, for which China often relies on Western suppliers. Policymakers have directed research institutes and state-run firms to buy them. Some competitors say Chinese firms have profited from Western open-source printing software. Last month an American court ruled that Bambu Lab had infringed on four patents held by an American company, and ordered it to pay $27.6m in damages. Although Chinese firms have captured the consumer market, they have struggled to do so for industrial 3D printers. Firms are wary of relying on Chinese products if it involves feeding them with sensitive designs (though Britain's defence ministry has been using Bambu printers, its government admits). Outside China, top-of-the-range machines are still mostly supplied by American and European outfits. They can sell for millions of dollars. Undeterred, Chinese suppliers are creating a new form of manufacturing at home and abroad. They are pioneering \"3D-printing farms\"—facilities with as many as 5,000 desktop 3D printers that operate like factories. Several have been built in China this year. Printing farms can mass-produce trinkets for zany consumer trends in short order, replacing expensive and slow injection-moulding techniques. Like the printers themselves, their output will be higher quality and cheaper than what came before.",

        plainText: "Singapore goes after companies over toxic haze — 2026/10/24 Singapore goes after companies over toxic haze Singapore is trying to hold companies to account as it grapples with its worst air pollution in a decade, but the smog-choked city-state is running into the limits of prosecuting cross-border environmental laws. The government has in recent days threatened legal action against 10 businesses, several with deep ties to Singapore, that it says are behind wildfires in neighbouring Indonesia that have produced the haze. It has also raised questions about whether other companies listed on the local bourse may be involved, and has threatened to target company profits, access to financing and standing with investors. \"Singapore — which wants to continue being an international finance centre — gets a lot of business from these companies,\" said Ivan Png at the National University of Singapore, who has campaigned for anti-haze legislation. He added that the companies \"depend on Singapore for equity and financing — you would think that would make them want to pay attention to what the government is saying\". The issue has also threatened a rift with Indonesia, where the fires are blamed on slash-and-burn practices by paper and palm oil producers. This year's fires have been exacerbated by a \"super\" El Niño, a natural weather phenomenon that has raised temperatures and reduced rainfall across Indonesia. Singapore's air quality has been classified by the government as \"very unhealthy\" this month, at times ranking the worst in the world, according to monitoring platform IQAir. Outdoor activities and sports events have been cancelled and hospital admissions for respiratory complaints have surged. The smog cast a pall over this month's Singapore Grand Prix. Public frustration is mounting with what has become a regular nuisance in the city-state that generally prides itself on effective governance. Singapore has taken steps to try to bring companies suspected of field burning — which is also illegal in Indonesia — to book. In 2014, it introduced a Transboundary Haze Pollution Act, which empowered the government to pursue criminal charges against companies found to have contributed to haze-producing fires and levy fines as high as S$100,000 (US$78,000) a day, capped at S$2mn (US$1.6mn) per conviction. But initial attempts to enforce the law stalled, with the environment ministry complaining that its Indonesian counterpart did not provide the necessary information to pursue charges. No company has been fined under the law. This year, Singapore has vowed to toughen its stance. In recent days, the government has served legal notices on 10 companies — identified using maps, meteorological data and satellite imagery — to demand they stop burning. Three of the businesses were served similar notices in 2015. \"If companies refuse to co-operate, regardless of whether they have a presence in Singapore... we will use every legal and regulatory lever at our disposal to exert pressure where it matters.\" At least four of the 10 companies are suppliers to Asia Pulp and Paper, which is headquartered in Singapore and part of Indonesian conglomerate Sinar Mas. Two others are run by permanent Singapore residents. Shanmugam said the government would investigate APP and several other companies listed in Singapore, where many Indonesian conglomerates access global capital. \"Some of the fires or smoke-source points seem to be associated with Singapore-listed First Resources and Bumitama Agri, as well as First Borneo Plantations,\" he said. \"We will be asking more questions of these companies.\" Shanmugam added that banks that lent to the businesses had also questioned them, and the Monetary Authority of Singapore, the city-state's financial regulator, would track lenders' risk exposure. First Resources said it welcomed the investigation, adding it was \"confident that an objective review of the available evidence will prove that it does not engage in any land clearing by fire, whether directly or indirectly\". APP, Bumitama Agri and First Borneo Plantations did not respond to requests for comment. SGX, the local bourse, has separately asked seven listed companies — including Golden-Agri Resources, Wilmar and Kencana Agri — about possible links to the haze. Indonesia's police chief said this week that authorities had named 11 corporations, three of them foreign, as suspects in connection with the fires. \"Some countries are mocking, insulting us... when many of their companies [operating] here are responsible,\" Indonesia's President Prabowo Subianto said in a speech on Thursday, adding: \"We will announce those names when the time comes.\" He did not identify the countries. Indonesia's government communication agency said: \"Indonesia and Singapore maintain channels of engagement on environmental issues, including transboundary pollution.\" It added that it prioritises \"the protection of affected communities, the containment of fires, and effective enforcement of environmental regulations\". NUS professor Png called for stronger laws to provide an incentive to whistleblowers, pointing to successful efforts in the US to combat bribery under the Foreign Corrupt Practices Act. \"It is very hard to collect evidence,\" he said. \"But when you offer incentives, whistleblowers will come out.\"",

        title: "How a Sydney professor built an AI army to scam the scammers",
        publishDate: "2026-10-23",

        annotatedPath: "/outward-reading/articles/2026/10/2026-10-23_001.annotated.html",
        plainText: "How a Sydney professor built an AI army to scam the scammers — 2026/10/23 How a Sydney professor built an AI army to scam the scammers The day that Dali Kaafar decided to start a company that unleashes an autonomous army of AI bots to take on the trillion-dollar global scam industry began like any other. It was a warm Saturday afternoon in spring. The Macquarie University professor of cybersecurity was enjoying a picnic with his wife and two children at a Sydney park. At some point, his mobile rang. Kaafar could tell from the number that it was a scam call, and while he usually ignored them, on this particular day, Kaafar decided to have some fun with the fraudsters. He picked up the call. \"The kids were a few years younger then, and for their entertainment, I pretended not to understand what the scammers were after, or I would give them the wrong details,\" he says. The scammers persisted, insisting that there was something wrong with Kaafar's internet and they needed remote access to his computer. Kaafar feigned incomprehension when they spoke about his tepid upload and download speeds. He distracted and delayed them: what was this NBN they spoke of? \"At one point, I think I was even trying to order a pizza,\" he says. \"As I hung up that call I remember very clearly saying, 'this was all great fun, but imagine what technology can do with these scammers at scale,'\" he says. While his children were in hysterics, his wife was less impressed. \"My wife said, 'those are 44 minutes of your own life that you will never get back.' You ruined the whole picnic experience. I said, 'That's even more reason for technology to jump in to do it better.'\" The following Monday, Kaafar called together a cohort of PhD students and a postdoctoral researcher with expertise in AI security and natural-language processing. They would build voice bots to ape the tech insecurities of the average caller: umm-ing and ahh-ing their way through conversations with scammers and apologising for not being very good with technology or computers. \"But then we all immediately realised that by keeping the scammers on the line we can also extract and deliver this real-time intelligence, actionable intelligence, to stay on top of what scammers are doing.\" In 2024, Kaafar founded Apate.ai, named after the Greek goddess of deception and fraud. Apate.ai deploys thousands of digital decoy identities across phone, email, messaging apps and social platforms, designed to be discovered directly by scammers searching for victims. \"We are flipping the script on the economics of fraud by beating these bad actors at their own game.\" Crucial to the success of the fleet of Apate.ai bots is their believability: whether texting or talking, Apate.ai agents must resemble an actual person – rather than a minutely programmed chatbot – to keep scammers on the line. The agents have phone numbers and WhatsApp accounts; they have personalities, PayIDs and pet peeves. Some have distinctive accents; others employ broad Australian slang (\"no worries\", they may say or \"let me just get a cuppa\"). \"We used to give them cute names, like Ricky and Pete, and we each had our favourite. But as we evolved to more than 200,000 bots, now they just have ID numbers,\" says Kaafar. Each bot operates with a defined mission, which may include keeping a scammer talking for as long as possible, extracting crucial intelligence about the scammers' operations, or manoeuvring the fraudster onto another platform where the interaction can continue. The mission may result in gathering details of scammer impersonation tactics, phishing URLs, mule bank accounts and crypto wallets – crucial information to help authorities shut down these networks. It's not unusual for Apate.ai voice bots to keep scammers on the line for more than two hours, with the record at two hours and 12 minutes at the time of our interview. \"Literally a scammer is busy talking to a bot is a scammer that is not placing thousands of calls a minute to other potential victims,\" says Kaafar. Occasionally, scammers end the call because they cotton on that they are talking to a bot. The realisation that a bot has been wasting the scammer's time usually results in a slew of profanities. \"I think we're the only company around that has a KPI linked to f-words,\" he says. Kaafar is keen to emphasise that while delaying and obfuscating scammers is deeply satisfying, it offers benefits beyond merely blocking calls. \"What we're trying to do is distract them and disrupt them by presenting them with the perfect victim. Then we make it really painful for them where exactly it matters for them, which is how much money they'll be making. \"We want to put the foot on the gas,\" he says.",

        annotatedPath: "/outward-reading/articles/2026/10/2026-10-22_001.annotated.html",
        plainText: "Musk's Promise to Give SpaceX Stock to Kids Is No Gift — 2026/10/22 Musk's Promise to Give SpaceX Stock to Kids Is No Gift One of the great joys, but also miseries, of following business news over the past decade or so has been riding the dodgy roller coaster of the Elon Musk experience. He has gone from a guy people considered a real-life Tony Stark to something more like a modern-day Henry Ford, in the worst possible way, with countless gut-wrenching twists in between. At no point, however, did anybody think: \"Hey, you know who's missing out on this? Children.\" Until today. SpaceX Chief Executive Officer Elon Musk pledged on Monday to donate one share of his company to each of America's 72 million children, vowing it would be the first such gift \"of many,\" if \"you had just this morning traveled here from another planet, then you might consider this a reasonably generous gesture from a near-trillionaire.\" The stock has been a bit stagnant since its June IPO, sure, but the company has billions of dollars in US government contracts, and Musk has promised its revenue will soar from less than $19 billion last year to $1 trillion by 2030. Such a gift would barely trouble Musk's vast wealth and power. It would cost about $10.5 billion, shaving Musk's net worth to $889.5 billion. And as my Bloomberg Opinion colleague Liam Denning points out, it would cut his SpaceX voting power, currently at 82% because of the stock's dual-class nature, by just 0.1 percentage points. But even a passing familiarity with Musk's whole vibe should raise many immediate concerns about this \"promise.\" For one thing, it was made on his social media app, X, formerly known as Twitter, on which Musk has promised many things, a large percentage of which have never happened. Most famous was his 2018 declaration that he had \"funding secured\" to take Tesla Inc. private at $420 a share. It got him in serious legal trouble when it turned out not to be true. If you have several hours to kill, you can peruse this website for a long list of other unfulfilled Musk promises, including a \"cross country summon\" feature that would let your Tesla travel the continent by itself, incredible-Journey style to find you; half-hour rocket trips from New York to London; 1 million robotaxis; and seafaring Teslas, to name a few. Buying stock in Musk is less an investment than it is subscribing to a streaming service for increasingly ridiculous science fiction. Also, it doesn't seem as if Musk spent long hours conferring with lawyers and accountants planning for this gift. Rather, the timing and Musk's track record suggest he saw SpaceX's AI rival, Anthropic PBC, making its own charitable pledge on Sunday and felt the urge to one-up it. The maker of Claude vowed to donate 5% of its shares, potentially worth $75 billion (if the company is worth $1.5 trillion), to a fund that will benefit the \"public good,\" including AI's destruction of jobs that kids want. Musk replied to Anthropic's X post making this announcement with a curt \"I recommend giving the shares directly to the public,\" suggesting he's just better at doing charity. His detail-free promise of one share per child followed hours later. How will children receive these shares? Nobody knows, and the odds are very good that nobody will ever have to find out. Anthropic's offer seems to be an olive branch to AI's large and growing contingent of haters and skeptics, including most of the American public, ahead of its IPO. Maybe it will also deflect some of the pressure to impose actual government regulation of the technology. Musk could use some good publicity, too, and not just because SpaceX is a growing AI giant. He has embraced White nationalism and let SpaceX's Starlink service undermine Ukraine's effort to defend itself from Russia's invasion. He manned the Department of Government Efficiency that slashed government jobs and offices without care for the repercussions, including the 700,000 people who have already died because of DOGE's assault on USAID. His behavior affects everyone invested in his companies, for better or worse, including those theoretical 72 million children. For a long time, \"worse\" has been a no-show; his fans have helped Tesla's stock price defy traditional market logic for years. How long can the magic last? As tough as children have it these days, with the climate in chaos, war in Europe and the Middle East and AI threatening to take all of the jobs, do they really need the headache of finding out?",

        annotatedPath: "/outward-reading/articles/2026/10/2026-10-21_001.annotated.html",
        plainText: "Paris police issue overnight curfew in 2 areas of French capital to try to prevent further disorder — 2026/10/21 Paris police issue overnight curfew in 2 areas of French capital to try to prevent further disorder PARIS (AP) — Paris police issued an overnight curfew on Monday in two areas of the French capital, after a weekend marred by France's worst rioting in years that targeted city halls, other public buildings and thousands of businesses across the country. The order aims to protect \"people and property from the violence and looting,\" the Paris police statement said. The curfew prohibits anyone from entering or remaining on the Place de la République, where rioting took place Saturday, and the shopping neighborhood of Les Halles, which has been subject to looting. Earlier Monday, Prime Minister Sébastien Lecornu had called for \"very limited\" and \"localized\" curfews. In northern France, local authorities imposed a curfew for children and teenagers under age 18 in several cities, including Lille. At least 2,400 people were arrested across the country. Authorities estimated Monday that at least 3,000 businesses were damaged or looted in several cities. Flames engulfed the 19th-century City Hall in Limoges, in central France, causing its roof to collapse and nearly destroying the building. The previous day, at the end of the protest against the rising cost of living, which brought together 5,500 people in Limoges, a group attacked the east wing of the city hall and started a fire. Within three hours, the roof of the historic building, inaugurated in 1883 and modeled after the Hôtel de Ville in Paris, was completely engulfed. \"I was horrified, but despite how violent what I saw was, I couldn't bring myself to leave.\" The day after the arson attack, Anne, a 47-year-old teacher, returned to the site and said she was still \"dumbfounded.\" Marine, 18, a literature student, on the verge of tears, said she felt \"heartbroken.\" \"I don't understand how things got to this point.\" \"Usually, our protests are always peaceful,\" continued Anne, who joined the march at 2 pm. \"There was some tension, we got a bit of tear gas, but I never felt unsafe, and then at 3:30 pm, suddenly, things deteriorated.\" On Sunday evening, a rally to condemn the violence drew 7,000 people. On Monday, cleanup crews and firefighters cleared shattered glass and other debris from the streets of Paris. Ouri Zagoury, owner of a video game shop near Paris' Place de la République, said that he closed the store Saturday afternoon, but then saw looters forcing their way in on surveillance cameras. \"There were so many people coming in and out. And even though I called the police, they said not to intervene, that they would come, but they never did, which is another problem,\" Zagoury said. Interior Minister Laurent Nuñez offered his resignation Sunday. But President Emmanuel Macron refused it \"given the need for continued command of law enforcement in the current context,\" Macron's office said. He instructed Nuñez \"to take all necessary steps to ensure full transparency about the failures in planning and intelligence-gathering that led to the violence.\" Nuñez acknowledged that authorities had \"lost control\" in some major cities on Saturday. \"You can't look shopkeepers in the eye when hundreds of businesses have been looted and say we haven't lost control in some of these major cities,\" Nuñez said. The protests in France began last month at high schools in Paris'working-class northern suburbs, where anger over teacher shortages and shabby facilities evolved into a broader movement. France's extremely strained public finances mean the government has precious little room for broader measures to address protesters'anger over the rising cost of living. The government has so far not committed to a substantial increase in funding for schools. However, it has pledged to send some 3,000 teachers, who are fully qualified but have not yet started work, to fill staffing gaps. The unrest will likely deal a blow to business confidence, which is already fragile due to a fiscal crisis and high energy prices resulting from the Iran war. The minority government is struggling to pass spending cuts in France's deeply divided parliament as part of its 2027 budget. The unrest has weighed on French stocks and the euro and put pressure on French government bonds. \"Le Pen no longer needs to spend any money to campaign,\" Jean-Baptiste Moreau, a former lawmaker from Macron's camp, told Reuters. \"It's not just a clear path ahead of her, it's a six-lane highway.\" Some protesters have already called for a new round of demonstrations on Saturday, October 24. Unions have called for strikes on November 5 to protest budget cuts and support hiking wages. The weekend violence has largely eclipsed the recent high school student protests. Schools are now on a break for two weeks, but there have been reports of protests at some universities. While mayors of France's biggest cities demanded answers from the government over what they say was a lack of preparation, authorities rushed to set up support measures for impacted businesses and bolster security as calm returned to the streets.",

        plainText: "October 17 French protests: Crowds marched through the streets before violence, looting and chaos broke out — 2026/10/20 October 17 French protests: Crowds marched through the streets before violence, looting and chaos broke out On Saturday, 800,000 people took to the streets according to organizers, while Interior Minister Laurent Nuñez put the number at 550,000. The same pattern played out in many cities: On one side, a crowd of peaceful protesters; on the other, independent groups determined to clash with the police. While turnout across the country was massive, the protests were also marred by unprecedented property damage, violence and looting. In France, several worlds seemed to have collided over one long day. The roots of the protests stretched back to September, when calls for demonstrations against rising fuel prices began circulating on social media. Meanwhile, high school students were protesting teacher shortages, overcrowded classrooms and poor school conditions. The unrest also revived memories of the Yellow Vest movement, which began in 2018 as a protest against fuel taxes before growing into a broader rebellion against economic inequality and President Emmanuel Macron's government. Behind these different grievances lay a deeper frustration: many French people felt squeezed by rising living costs, disappointed by public services and increasingly distrustful of political leaders. Students, workers and Yellow Vest veterans saw an opportunity to unite their separate struggles. Responding to a call to action that notably cited the rising cost of living, but also building on the momentum of the high school student protest movement that began in late September, Saturday's demonstrations aimed to create a \"convergence of struggles\" between various groups, ranging from \"Yellow Vests\" to high school students, several professional sectors, left-wing political leaders and trade unions. At exactly 10 am, outside Gare Saint-Lazare train station, one Yellow Vest summed up his twofold ambition for the day: \"First, the revolution, but also to sleep in Macron's bed.\" He said this with a mixture of humor and seriousness, going on to denounce capitalism, the bourgeoisie, the police and the cost of living. Everyone in his entourage chimed in relentlessly, listing their demands, frustrations and anger, until their conversation was abruptly cut short when a BRAV-M motorcycle police unit suddenly barged in and descended on the group. Several small autonomous gatherings started forming in the morning. They aimed to head toward the Élysée Palace, the Place de la Concorde or the Opéra – basically, to push as far as possible. There was no official procession, no leader, no truly defined objective, just packs of individuals on the move, light on their feet. \"Strike, blockade, wild protest!\" mask-clad people shouted as they sprinted toward Avenue de l'Opéra. In Paris, the situation seemed to at least partially slip out of control from the early afternoon, while, at the same time, taking on several different forms. Place de la République, the starting point for the official demonstration was packed to bursting. Some violent and organized protesters began by attacking street furniture, then tried to break into the Republican Guard barracks, set a car on fire and smashed things left, right and center. While it might not exactly have been the much-heralded \"convergence of struggles,\" the march still brought together people from all walks of life. Lucie and Thomas, who both just graduated from the prestigious HEC business school, proclaimed their support for the movement: \"We are aware that we are privileged students and we have a duty of solidarity.\" The same pattern also played out in several other cities. On one side, large groups of demonstrators marched in dozens of peaceful processions from Rennes (Brittany) to Toulouse (south), despite the tensions. On the other, independent groups were determined to clash with the police. In the streets, groups of university and high school students, toughened up by weeks of protest, mingled with small groups that organized to confront law enforcement units. Protesters from working-class neighborhoods were there, as well as a good number of looters who could hardly believe their eyes: All the opulence of Paris's wealthy districts was suddenly within reach, whether by hand or by hammer. \"These neighborhoods are rich here. It's all from the profits made off the suburbs,\" shouted a very young man in the middle of a small group, as they made their way near Rue Lafayette. On several of Paris's major right bank streets, the same scenes, with the same violent acts, played out again and again. Paving stones were thrown. Cars, trucks and construction vehicles were set on fire. Starting from Madeleine, Kenzo, Salomon and Arc'teryx boutiques had their windows smashed and shelves ransacked. The Céline store on Avenue Montaigne was pillaged. In nearby streets, one guy and his friends were asking, \"Where is Chanel?\" On Saturday evening, Lecornu announced that 1,200 people had been arrested and 150 police officers and gendarmes injured. \"We will all stand united against the sowers of chaos, who seek only to bring down our institutions and prevent those who peacefully express their demands from doing so,\" he said.",

        title: "El Niño Threatens Global Sugar Supply",

        annotatedPath: "/outward-reading/articles/2026/10/2026-10-19_001.annotated.html",
        plainText: "El Niño Threatens Global Sugar Supply — 2026/10/19 El Niño Threatens Global Sugar Supply Conflict. Climate change. A withering El Niño. All are conspiring to spoil the world's sweet tooth. Global sugar prices have soared, as a hot, dry summer scorched much of the sugar-producing parts of the world, nudging overall food prices upward. Nowhere is that felt as acutely as it is in India, the biggest sugar consumer in the world and the second-biggest producer. The worst monsoon in 11 years and fears of a poor sugarcane harvest have spiked prices amid the Hindu festival season, when gods and mortals alike are feted with sweets. Making matters worse, high sugar prices are also complicating India's energy security goals. Sugarcane is a key crop for the country's biofuels push, all the more so as India seeks to curb oil imports while the waterways of the Middle East are choked by war. This year's El Niño has left many of the country's sugarcane fields parched, just a year after they were drenched by excess rains and devoured by pests. Protests have broken out over rising prices. The government has warned sugar traders against hoarding. And a country that usually exports sugar has taken the extraordinary step of opening the doors to imports this year, further raising global sugar prices. \"This crop is gone,\" Morarji Patil, a 30-year-old farmer, said as he stood beside his cane field one sweaty September morning in the Marathwada region of western India. Like other farmers here, Mr. Patil was already crushed by debt and high fertilizer prices before the blistering heat and scant rains. His cane stalks were thin and short, stunted by a lack of water this summer when they needed it most. Mr. Patil expected his yields to be 70 percent lower than normal. India represents an object lesson on the far-reaching effects of conflict and extreme weather on a nation's economy. Food prices are rising month by month. Key crops remain at risk as the long tail of El Niño drags out through next year, heightening the likelihood of extreme drought and flood. On top of that, India is extremely vulnerable to global oil supply shocks. It imports the vast majority of its crude oil. It's not just India. Extraordinary heat and drought this year have hit sugarcane in Brazil, the world's biggest sugar producer, and sugar beets in Europe. Global sugar prices are nearly 15 percent higher than they were a year ago. In India, sugar has long enjoyed state support. Most recently, the industry profited from a government directive that made 20-percent ethanol blends the standard fuel at Indian gas stations. The government said its biofuels push reduced oil demand and climate pollution, while also saving the country's precious foreign exchange. It called ethanol blends \"a key pillar of India's energy transition.\" It offered sugar refineries an additional source of revenue. It also infuriated Indian drivers. Aditya Kare, 21, was refueling his 2018 Hero motorcycle at a gas station in the nearby city of Latur. He said the ethanol blend had reduced his average mileage from 60 kilometers per liter to around 45, and he was having a hard time making do with the 100 rupees, a little more than $1, that his parents gave him for his commute to college. \"At home, we are planning to get an electric bike,\" he said. Sugarcane comes with a high cost. It is a thirsty crop, and its demand, for both food and fuel, is forcing many farmers to drill deeper for water and drain local aquifers. Mr. Patil's well goes down 800 feet. This year, even at that depth, there is no water. A dam on the Manjara River has become a dry ditch. Ponds are bare. \"This environment is not good for sugarcane,\" said Ganesh Gomare, a farmer. \"But the economy of Marathwada is dependent on sugarcane.\" \"Sugar is tempting. It enjoys relatively high profits.\" So Mr. Gomare, 38, devoted more of his land to sugarcane this year. It backfired. He expects his yields to be half of normal. Nearby, Dagdu Venkat Rao Padile, 66, uprooted a stalk of sugarcane from his field. The plant was emaciated. Its sugar content would be paltry. \"It will cost me more to cut it than what I'll get for it,\" Mr. Padile said. His yields would be one-fourth of normal. The rains were so poor that he had left most of his land fallow. Tanisha Gaikwad had all but cut sugar from her diet. But she joined the line at the sweet shop for a small box of laddoos to offer at the altar for Mahalaxmi, a goddess of wealth and power. Her prayers, she said, could not be sugar-free.",

        plainText: "The Tesla Roadster flew, drove upside down, and hit 60mph in under a second — 2026/10/18 The Tesla Roadster flew, drove upside down, and hit 60mph in under a second Elon Musk promised a flying car. And the Tesla Roadster did exactly that. Tesla demonstrated its next-generation Roadster at an event in Waco, Texas, where the electric supercar drove upside down, briefly flew, and accelerated to 60mph in under a second. It was an impressive demonstration of a car that likely will come with some heavy caveats and restrictions if it ever goes into production. The event was less than 30 minutes and felt more like a stunt show than a product reveal. Indeed, there was no mention of price, trim levels, release date, or other such mundane details. Musk promised the hypercar would go into production in 2028, but after nearly nine years who's counting. The people were here to see a car fly, and that's what Tesla gave them. First, the Roadster drove up a very tall, multi-story ramp, using its incredible downforce to cling to the vertical roadway. When it reached the top of the ramp, it flipped around using its cold-gas thrusters to bring it gently back down to earth. The car uses a fan-based suction system, supplied by SpaceX and mounted underneath the vehicle, which is capable of generating up to two Gs of suction force. Next, the Roadster flew over the rest of Tesla's lineup, including the Model 3, Model Y, Cybertruck, Semi, and Cybercab — doing what Tesla VP for Engineering Lars Moravy called \"a kick flip\" in the process. Musk explained that it features attitude-control thrusters as well as main thrusters at the rear, giving the Roadster rocket-like capabilities. \"So it can basically fly like a rocket,\" Musk said. \"And it could do rolls. It could do, like, crazy gymnastics. Whatever you want, really. Now, I should say that this is not necessarily a safety-optimized car. But it takes the fun meter to 11 out of 10.\" Of course, it seems extremely unlikely that this version of the car will ever be available to the average consumer — even as Musk claimed \"This will be an actual car that's on the roads.\" The company would have to satisfy strict regulatory requirements from the Federal Aviation Administration, as well as the National Highway Traffic Safety Administration. The Roadster could go into production in 2028, as Musk promised — or it could be another decade of missed deadlines and broken promises. Again, who cares? Car flew. Tesla has also said that the Roadster can accelerate from 0-60mph in less than a second. And during the event, the company claimed it did so in 0.81 seconds. Musk explained that increasing the applied force while reducing the vehicle's mass help boost acceleration. \"You've got to crack halfway to the speed of sound, I think,\" Musk teased. \"Mach 0.5. Maybe a little higher.\" The next-gen Roadster certainly took the scenic route in getting here. A prototype version was announced as a \"one more thing\" style surprise during the 2017 Tesla Semi event. The specs sounded ludicrous even back then: 0-60 mph in 1.9 seconds, a top speed over 250 mph, a 200 kWh battery delivering up to 620 miles of range, and a $200,000 starting price tag. Musk said deliveries would start in 2020, which sounded perfectly doable at the time. Early adopters quickly threw down $50,000 deposits (or $250,000 for the limited Founders Series), effectively interest-free loans to help fund Tesla's scaling ambitions. But then Tesla seemed to forget about the Roadster, cementing its status as the ultimate vaporware. Production deadlines slipped as Tesla prioritized mass-market vehicles like the Model Y, while also wrestling with the overly complicated Cybertruck. Occasionally, when Musk would remember that the Roadster existed, he would up the ante about its capabilities. This culminated in the \"SpaceX package\" that would equip the supercar with cold-gas thrusters, bestowing hover powers and a 0-60 time under one second. Musk has also sought to downplay the Roadster's significance, calling it a \"small potato situation\" that will not \"move the needle in a major way financially.\" He's framed the supercar more as a joint engineering collaboration between Tesla and SpaceX, even questioning whether it's \"even a car anymore\" given its experimental nature. Some analysts theorize that the decision to re-release the Roadster is an attempt to set the stage for a rumored Tesla-SpaceX merger. Tesla's failure to bring the Roadster to market allowed other automakers to slip past the company with their own hyper-powered EVs. Rimac has smashed performance records with the Nevera, Porsche has refined electric performance with the Taycan, and Chinese giants like BYD are producing track-ready supercars at a fraction of the cost. The Roadster is no longer shocking the world as an impossible prototype; it's playing catch-up to an industry that spent nine years building what Tesla merely rendered. But then again, none of those cars flew.",

        title: "Mark Carney shows middle powers how to handle a dangerous world",
